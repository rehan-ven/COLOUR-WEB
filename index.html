              <div style="display:flex; gap:var(--space-sm);">
                <button type="button" class="btn btn-soft" onclick="marketClearBasket()">Empty Basket</button>
                <button type="button" class="btn btn-audio" onclick="speakText('What colour are the bananas? They are yellow!')">Hear Question</button>
              </div>
            </div>
          </div>

          <!-- Shopkeeper Dialogue -->
          <div class="card card-grape" style="margin-top:var(--space-lg);">
            <h3>Shopkeeper Conversation</h3>
            <p style="margin:var(--space-xs) 0;"><strong>Shopkeeper:</strong> "Hello! What would you like?"
              <button type="button" class="btn btn-audio" onclick="speakText('Hello! What would you like?')">Listen</button>
            </p>
            ${session.marketDialogueStep === 0 ? `
              <div style="display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-top:var(--space-sm);">
                <button type="button" class="btn btn-primary" onclick="marketDialoguePick('correct')">"I would like two red apples, please."</button>
                <button type="button" class="btn btn-soft" onclick="marketDialoguePick('wrong')">"Give me apples."</button>
              </div>
            ` : `
              <div class="feedback-box success">
                <span><strong>You:</strong> "I would like two red apples, please." → <strong>Shopkeeper:</strong> "Here you are!" → <strong>You:</strong> "Thank you!"</span>
              </div>
            `}
            <div id="market-dialogue-fb" class="feedback-box" style="margin-top:var(--space-sm);">
              <span>Choose the friendly English reply!</span>
            </div>
          </div>
        </section>
      `;
    }

    // -------------------------------------------------------------------------
    // CHAPTER 5: THE COLOURFUL ART STUDIO (FUNCTIONAL DIGITAL COLOURING CANVAS)
    // -------------------------------------------------------------------------
    function studioPickColour(colour) {
      session.studioSelectedColour = colour;
      playChime(`pop`);
      speakText(COLOURS[colour].name);
      renderView();
    }

    function studioPaintPart(partName) {
      const col = session.studioSelectedColour;
      appState.currentCanvasColors[partName] = col;
      playChime(`pop`);
      speakText(`The ${partName.replace(/[0-9]/g, '')} is ${col}!`);

      // Track guided suggestions gently without forcing
      if ((partName === `sun` && col === `yellow`) || (partName === `roof` && col === `red`) || (partName === `door` && col === `blue`)) {
        if (!session.studioGuidedDone.includes(partName)) session.studioGuidedDone.push(partName);
      }

      const paintedCount = Object.values(appState.currentCanvasColors).filter(c => c !== `white`).length;
      if (paintedCount >= 5) {
        completeChapter(`studio`);
      }
      saveState();
      renderView();
    }

    function studioResetCanvas() {
      Object.keys(appState.currentCanvasColors).forEach(k => {
        appState.currentCanvasColors[k] = `white`;
      });
      saveState();
      renderView();
    }

    function studioDescribeArtwork() {
      const c = appState.currentCanvasColors;
      const sentences = [
        `The sun is ${c.sun}.`,
        `The roof is ${c.roof}.`,
        `The house is ${c.wall}.`,
        `The door is ${c.door}.`,
        `The flowers are ${c.flower1} and ${c.flower2}.`
      ];
      const text = sentences.join(` `);
      speakText(text);
      const fb = document.getElementById(`studio-feedback`);
      if (fb) {
        fb.className = `feedback-box success`;
        fb.textContent = `Your Artwork Description: "${text}"`;
      }
    }

    function studioSaveToGallery() {
      const snapshot = Object.assign({}, appState.currentCanvasColors);
      appState.savedArtworks.push({
        id: Date.now(),
        artist: appState.learnerName || appState.companion,
        colors: snapshot
      });
      completeChapter(`studio`);
      speakText(`You are a wonderful artist! Your painting is saved in your Trophy Book.`);
      saveState();
      const fb = document.getElementById(`studio-feedback`);
      if (fb) {
        fb.className = `feedback-box success`;

      const t = TOYS.find(x => x.id === id);

      playChime(`pop`);
      speakText(`It is a ${t.name}!`);
      const riddle = TOY_RIDDLES[session.toyRiddleIndex];
      const fb = document.getElementById(`toys-feedback`);
      if (riddle && id === riddle.answer) {
        playChime(`win`);
        speakText(`Amazing! You solved the mystery toy: ${t.name}!`);

          session.toyRiddleIndex++;

          completeChapter(`toys`);
          renderView();

      speakText(ans);
      renderView();

    const RAINBOW_ORDER = [`red`, `orange`, `yellow`, `green`, `blue`, `indigo`, `violet`];

    function castleCheckMissing(choice) {
      session.castleMissingChoice = choice;
      const fb = document.getElementById(`castle-feedback`);
      if (choice === `green`) {
        playChime(`win`);
        speakText(`Yes! Green is between yellow and blue!`);
        renderView();
      } else {
        playChime(`hint`);
        speakText(`Not quite! Remember: Red, Orange, Yellow, Green, Blue, Indigo, Violet.`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Almost! Look at the rainbow sequence again.`; }
      }
    }

    function castleSelectBlock(colour) {
      session.castleSelectedBlock = colour;
      playChime(`pop`);
      speakText(COLOURS[colour].name);
      renderView();
    }

    function castlePlaceInSlot(idx) {
      const picked = session.castleSelectedBlock;
      if (!picked) {
        const fb = document.getElementById(`castle-feedback`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `First pick a rainbow block below, then tap slot ${idx + 1}!`; }
        return;
      }
      if (RAINBOW_ORDER[idx] === picked) {
        session.castleBridge[idx] = picked;
        session.castleSelectedBlock = null;
        playChime(`pop`);
        if (session.castleBridge.every(Boolean)) {
          completeChapter(`castle`);
          speakText(`Hooray! You rebuilt the Rainbow Bridge and saved Colourland!`);
        }
        renderView();
      } else {
        playChime(`hint`);
        speakText(`Try another spot! Slot ${idx + 1} needs ${RAINBOW_ORDER[idx]}.`);
        const fb = document.getElementById(`castle-feedback`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Hint: Slot ${idx + 1} is ${COLOURS[RAINBOW_ORDER[idx]].name}!`; }
      }
    }

      const list = appState.missions.aroundMe;

        speakText(`I can see something ${colour}!`);

      saveState();
      renderView();
    }

      const inp = document.getElementById(`mission1-note`);

      appState.missions.aroundMeNote = inp.value.trim();
      if (appState.missions.aroundMeNote) speakText(appState.missions.aroundMeNote);

      renderView();

                <div><strong>Shirt:</strong> ${[`red`, `white`, `orange`].map(c => `<button type="button" class="btn ${o.shirt === c ? 'btn-primary' : 'btn-soft'}" style="min-height:36px; padding:4px 12px;" onclick="setOutfitColour('shirt','${c}')">${COLOURS[c].name}</button>`).join(` `)}</div>

                  <rect x="394" y="132" width="8" height="26" fill="var(--color-red)"/>

                <input type="text" id="mission4-note" value="${m.classroomNote}" style="flex:1;" placeholder="I can see a green book and a yellow pencil.">
                <button type="button" class="btn btn-primary" onclick="saveClassroomNote()">Save Answer</button>
              </div>
            </div>
          </div>`;
      } else {
        const opts = {
          red:    [`Red Apple`, `Red Car`, `Red Flower`],
          blue:   [`Blue Butterfly`, `Blue Ball`, `Blue Bag`],
          green:  [`Green Leaf`, `Green Watermelon`, `Green Kite`],
          yellow: [`Yellow Sun`, `Yellow Banana`, `Yellow Teddy Bear`]
        };
        body = `
          <div class="card card-sky">
            <h3>Mission 5: My Colour Collection</h3>
            <p>Choose your favourite object for each colour to build your personal Colour Collection!</p>
            <div class="grid-2">
              ${[`red`, `blue`, `green`, `yellow`].map(c => `
                <div style="padding:var(--space-md); background:var(--surface-container); border-radius:var(--rounded);">
                  <strong style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                    <span class="colour-dot" style="background:${COLOURS[c].css};"></span> My favourite ${c} object: ${m.collection[c]}

                  <div class="swatch-row">
                    ${opts[c].map(item => `<button type="button" class="btn ${m.collection[c] === item ? 'btn-primary' : 'btn-soft'}" style="min-height:36px; padding:4px 12px;" onclick="setCollectionItem('${c}','${item}')">${item}</button>`).join(``)}
                  </div>
                </div>`).join(``)}

            <div style="margin-top:var(--space-md);">
              <button type="button" class="btn btn-audio" onclick="speakText('My colour collection has a ${m.collection.red}, a ${m.collection.blue}, a ${m.collection.green}, and a ${m.collection.yellow}!')">Hear My Whole Collection</button>

      return `
        <section class="hero-panel">
          <span class="kicker">Real-Life Colour Missions</span>
          <h1 class="display">Colours in My <em>Everyday</em> Life</h1>
          <div class="pill-tabs">
            ${tabTitles.map((t, idx) => `
              <button type="button" class="btn btn-nav ${tab === idx + 1 ? 'active' : ''}" onclick="setMissionTab(${idx + 1})">${t}</button>`).join(``)}

    // -------------------------------------------------------------------------
    // SECTION 12: ALL 12 INTERACTIVE MINI-GAMES
    // -------------------------------------------------------------------------
    const GAMES_LIST = [
      { id: 1,  name: `1. Colour Pop` },
      { id: 2,  name: `2. Colour Match` },
      { id: 3,  name: `3. Colour Detective` },
      { id: 4,  name: `4. Rainbow Puzzle` },
      { id: 5,  name: `5. Mix It!` },
      { id: 6,  name: `6. Colour Memory` },
      { id: 7,  name: `7. Listen & Colour` },
      { id: 8,  name: `8. Mystery Colour` },
      { id: 9,  name: `9. Sort the Colours` },
      { id: 10, name: `10. Colour Hunt` },
      { id: 11, name: `11. What's Missing?` },
      { id: 12, name: `12. Colour Creator` }
    ];

    function selectMiniGame(id) {
      appState.activeGameId = id;
      if (id === 6 && session.g6Cards.length === 0) initMemoryGame();
      saveState();
      renderView();
    }

    // Game 1: Colour Pop
    function g1PopBalloon(col) {
      const fb = document.getElementById(`g1-fb`);
      if (col === session.g1Target) {
        session.g1Popped++;
        playChime(`pop`);
        const targets = [`red`, `blue`, `yellow`, `green`, `purple`];
        session.g1Target = targets[session.g1Popped % targets.length];
        if (session.g1Popped >= 5) {
          awardGameStar(1);
          speakText(`Pop! Amazing! You popped five balloons!`);
        } else {
          speakText(`Pop! Now pop the ${session.g1Target} balloon!`);
        }
        renderView();
      } else {
        playChime(`hint`);
        speakText(`That is ${col}! Try the ${session.g1Target} balloon.`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Oops, that balloon is ${col}! Pop the ${session.g1Target} balloon!`; }
      }
    }

    // Game 2: Colour Match
    function g2PickObj(objCol) { session.g2SelectedObj = objCol; playChime(`pop`); renderView(); }
    function g2PickColour(col) {
      if (!session.g2SelectedObj) return;
      if (session.g2SelectedObj === col) {
        if (!session.g2Matched.includes(col)) session.g2Matched.push(col);
        session.g2SelectedObj = null;
        playChime(`win`);
        speakText(`Great match! ${COLOURS[col].name}!`);
        if (session.g2Matched.length >= 4) awardGameStar(2);
      } else {
        playChime(`hint`);
        speakText(`Try again!`);
      }
      renderView();
    }

    // Game 3: Colour Detective
    function g3Tap(id, col) {
      if (col === `yellow`) {
        if (!session.g3Found.includes(id)) session.g3Found.push(id);
        playChime(`pop`);
        speakText(`Found a yellow object!`);
        if (session.g3Found.length >= 3) awardGameStar(3);
      } else {
        playChime(`hint`);
        speakText(`That is ${col}. Look for yellow!`);
      }
      renderView();
    }

    // Game 4: Rainbow Puzzle
    function g4TapStripe(idx) {
      if (session.g4Picked === null) {
        session.g4Picked = idx;
      } else {
        const tmp = session.g4Order[session.g4Picked];
        session.g4Order[session.g4Picked] = session.g4Order[idx];
        session.g4Order[idx] = tmp;
        session.g4Picked = null;
        playChime(`pop`);
        if (session.g4Order.every((c, i) => c === RAINBOW_ORDER[i])) {
          awardGameStar(4);
          speakText(`Perfect rainbow order!`);
        }
      }
      renderView();
    }

    // Game 5: Mix It!
    function g5Pick(col) {
      if (session.g5Picks.includes(col)) session.g5Picks = session.g5Picks.filter(x => x !== col);
      else if (session.g5Picks.length < 2) session.g5Picks.push(col);
      playChime(`pop`);
      renderView();
    }
    function g5Check() {
      const p = session.g5Picks.slice().sort().join(`+`);
      const targets = { purple: `blue+red`, green: `blue+yellow`, orange: `red+yellow` };
      if (p === targets[session.g5Target]) {
        playChime(`win`);
        speakText(`Yes! You made ${session.g5Target}!`);
        awardGameStar(5);
        session.g5Target = session.g5Target === `purple` ? `green` : session.g5Target === `green` ? `orange` : `purple`;
        session.g5Picks = [];
      } else {
        playChime(`hint`);
        speakText(`Not quite! Try two different primary colours.`);
      }
      renderView();
    }

    // Game 6: Colour Memory
    function initMemoryGame() {
      const base = [
        { key: `red`,    label: `Red` },    { key: `red`,    label: `Apple` },
        { key: `blue`,   label: `Blue` },   { key: `blue`,   label: `Sky` },
        { key: `yellow`, label: `Yellow` }, { key: `yellow`, label: `Sun` },
        { key: `green`,  label: `Green` },  { key: `green`,  label: `Leaf` }
      ];
      session.g6Cards = base.sort(() => Math.random() - 0.5);
      session.g6Flipped = [];
      session.g6Matched = [];
    }
    function g6Flip(idx) {
      if (session.g6Flipped.includes(idx) || session.g6Matched.includes(session.g6Cards[idx].key) || session.g6Flipped.length >= 2) return;
      session.g6Flipped.push(idx);
      playChime(`pop`);
      speakText(session.g6Cards[idx].label);
      if (session.g6Flipped.length === 2) {
        const [a, b] = session.g6Flipped;
        if (session.g6Cards[a].key === session.g6Cards[b].key) {
          session.g6Matched.push(session.g6Cards[a].key);
          session.g6Flipped = [];
          playChime(`win`);
          if (session.g6Matched.length >= 4) awardGameStar(6);
          renderView();
        } else {
          renderView();
          setTimeout(() => { session.g6Flipped = []; renderView(); }, 750);
          return;
        }
      }
      renderView();
    }

    // Game 7: Listen & Colour
    function g7Paint(shape) {
      const col = session.g7TargetCol;
      if (shape === session.g7TargetShape) {
        session.g7Painted[shape] = col;
        playChime(`win`);
        speakText(`Great listening! The ${shape} is ${col}!`);
        if (shape === `star`) { session.g7TargetShape = `heart`; session.g7TargetCol = `pink`; }
        else if (shape === `heart`) { session.g7TargetShape = `leaf`; session.g7TargetCol = `green`; }
        else { awardGameStar(7); }
      } else {
        playChime(`hint`);
        speakText(`Listen carefully! Colour the ${session.g7TargetShape} ${session.g7TargetCol}.`);
      }
      renderView();
    }

    // Game 8: Mystery Colour
    const G8_RIDDLES = [
      { q: `I am yellow. Monkeys love to eat me. What am I?`, opts: [`Banana`, `Apple`, `Frog`], ans: `Banana` },
      { q: `I am green. I can jump in a pond. Ribbit! What am I?`, opts: [`Carrot`, `Frog`, `Cloud`], ans: `Frog` },
      { q: `I am red and round. I grow on a tree. What am I?`, opts: [`Apple`, `Grape`, `Sun`], ans: `Apple` }
    ];
    function g8Answer(choice) {
      const r = G8_RIDDLES[session.g8Index];
      if (choice === r.ans) {
        playChime(`win`);
        speakText(`Correct! It is a ${choice}!`);
        session.g8Index = (session.g8Index + 1) % G8_RIDDLES.length;
        awardGameStar(8);
      } else {
        playChime(`hint`);
        speakText(`Try again!`);
      }
      renderView();
    }

    // Game 9: Sort the Colours
    const G9_ITEMS = [
      { id: `strawberry`, label: `Red Strawberry`, col: `red` },
      { id: `whale`,      label: `Blue Whale`,     col: `blue` },
      { id: `frog`,       label: `Green Frog`,     col: `green` },
      { id: `ladybug`,    label: `Red Ladybug`,    col: `red` },
      { id: `sky`,        label: `Blue Jeans`,     col: `blue` },
      { id: `pear`,       label: `Green Pear`,     col: `green` }
    ];
    function g9Select(id) { session.g9Selected = id; playChime(`pop`); renderView(); }
    function g9DropBin(binCol) {
      if (!session.g9Selected) return;
      const item = G9_ITEMS.find(x => x.id === session.g9Selected);
      if (item && item.col === binCol) {
        session.g9Sorted.push(item.id);
        session.g9Selected = null;
        playChime(`win`);
        speakText(`${item.label} goes in the ${binCol} bin!`);
        if (session.g9Sorted.length >= G9_ITEMS.length) awardGameStar(9);
      } else {
        playChime(`hint`);
        speakText(`Look at the colour of that item!`);
      }
      renderView();
    }

    // Game 10: Colour Hunt
    function g10Collect(idx) {
      if (!session.g10Found.includes(idx)) session.g10Found.push(idx);
      playChime(`pop`);
      speakText(`Found purple item ${session.g10Found.length} of 4!`);
      if (session.g10Found.length >= 4) awardGameStar(10);
      renderView();
    }

    // Game 11: What's Missing?
    const G11_PATTERNS = [
      { seq: [`Red`, `Blue`, `Red`, `___`], opts: [`Blue`, `Green`, `Yellow`], ans: `Blue` },
      { seq: [`Yellow`, `Green`, `Purple`, `Yellow`, `___`], opts: [`Orange`, `Green`, `Red`], ans: `Green` }
    ];
    function g11Pick(opt) {
      const p = G11_PATTERNS[session.g11Index];
      if (opt === p.ans) {
        playChime(`win`);
        speakText(`Great pattern! The missing colour is ${opt}!`);
        session.g11Index = (session.g11Index + 1) % G11_PATTERNS.length;
        awardGameStar(11);
      } else {
        playChime(`hint`);
        speakText(`Look at the pattern again!`);
      }
      renderView();
    }

    // Game 12: Colour Creator
    function g12SetColour(c) { session.g12ActiveColour = c; playChime(`pop`); renderView(); }
    function g12SetShape(s) { session.g12ActiveShape = s; playChime(`pop`); renderView(); }
    function g12StampAt(ev) {
      const svg = ev.currentTarget;
      const rect = svg.getBoundingClientRect();
      const x = Math.round(((ev.clientX - rect.left) / rect.width) * 500);
      const y = Math.round(((ev.clientY - rect.top) / rect.height) * 240);
      session.g12Stamps.push({ x, y, col: session.g12ActiveColour, shape: session.g12ActiveShape });
      playChime(`pop`);
      if (session.g12Stamps.length >= 4) awardGameStar(12);
      renderView();
    }
    function g12Clear() { session.g12Stamps = []; renderView(); }

    function renderGamesView() {
      const gid = appState.activeGameId;
      let gameHtml = ``;

      if (gid === 1) {

            <div id="g1-fb" class="feedback-box"><span>Tap the ${session.g1Target} balloon!</span></div>

      } else if (gid === 2) {
        const objs = [{ c: `red`, label: `Strawberry` }, { c: `green`, label: `Leaf` }, { c: `yellow`, label: `Sun` }, { c: `blue`, label: `Sky` }];
        gameHtml = `
          <div class="card">
            <h3>Game 2: Colour Match (${session.g2Matched.length}/4)</h3>

              </div>
              <div style="display:grid; gap:var(--space-xs);">
                ${[`blue`, `red`, `yellow`, `green`].map(c => `<button type="button" class="btn btn-soft" ${session.g2Matched.includes(c) ? 'disabled' : ''} onclick="g2PickColour('${c}')"><span class="colour-dot" style="background:${COLOURS[c].css};"></span> ${COLOURS[c].name}</button>`).join(``)}
              </div>
            </div>
          </div>`;
      } else if (gid === 3) {
        gameHtml = `
          <div class="card">
            <h3>Game 3: Colour Detective (${session.g3Found.length}/3 yellow things)</h3>
            <p>Find and tap all 3 <strong>YELLOW</strong> objects in the park!</p>
            <svg viewBox="0 0 500 200" class="scene-svg" style="background:var(--color-sky-soft);">
              <rect x="0" y="140" width="500" height="60" fill="var(--color-grass-soft)"/>
              <circle cx="80" cy="50" r="28" fill="var(--color-yellow)" class="interactive-obj" onclick="g3Tap('sun','yellow')"/>
              <circle cx="210" cy="145" r="20" fill="var(--color-red)" class="interactive-obj" onclick="g3Tap('ball','red')"/>
              <ellipse cx="320" cy="148" rx="22" ry="15" fill="var(--color-yellow)" class="interactive-obj" onclick="g3Tap('duck','yellow')"/>
              <circle cx="430" cy="135" r="18" fill="var(--color-yellow)" class="interactive-obj" onclick="g3Tap('flower','yellow')"/>
              <rect x="130" y="95" width="35" height="55" fill="var(--color-blue)" class="interactive-obj" onclick="g3Tap('bench','blue')"/>
            </svg>
          </div>`;
      } else if (gid === 4) {
        gameHtml = `
          <div class="card">
            <h3>Game 4: Rainbow Puzzle</h3>
            <p>Tap two stripes to swap them until they read: Red, Orange, Yellow, Green, Blue, Indigo, Violet!</p>
            <div style="display:grid; gap:6px; max-width:440px;">
              ${session.g4Order.map((c, idx) => `
                <button type="button" class="btn" style="background:${COLOURS[c].css}; color:${COLOURS[c].textLight ? 'var(--color-white)' : 'var(--on-surface)'}; border: ${session.g4Picked === idx ? '4px solid var(--on-surface)' : 'none'};" onclick="g4TapStripe(${idx})">
                  ${COLOURS[c].name} ${session.g4Picked === idx ? '(Selected)' : ''}
                </button>`).join(``)}
            </div>
          </div>`;
      } else if (gid === 5) {
        gameHtml = `
          <div class="card">
            <h3>Game 5: Mix It!</h3>
            <p>Which TWO primary colours make <strong>${session.g5Target.toUpperCase()}</strong>?</p>
            <div class="swatch-row" style="margin-bottom:var(--space-md);">
              ${[`red`, `yellow`, `blue`].map(c => `
                <button type="button" class="colour-chip ${session.g5Picks.includes(c) ? 'selected' : ''}" onclick="g5Pick('${c}')">
                  <span class="colour-dot" style="background:${COLOURS[c].css};"></span> ${COLOURS[c].name}
                </button>`).join(``)}
            </div>
            <button type="button" class="btn btn-primary" onclick="g5Check()">Check Mix!</button>
          </div>`;
      } else if (gid === 6) {
        gameHtml = `
          <div class="card">
            <h3>Game 6: Colour Memory (${session.g6Matched.length}/4 pairs)</h3>
            <p>Flip two cards to match each colour name with its object!</p>
            <div class="memory-grid">
              ${session.g6Cards.map((card, i) => {
                const isFlipped = session.g6Flipped.includes(i);
                const isMatched = session.g6Matched.includes(card.key);
                return `<button type="button" class="memory-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}" onclick="g6Flip(${i})">
                  ${(isFlipped || isMatched) ? `<span class="colour-dot" style="background:${COLOURS[card.key].css};"></span><span>${card.label}</span>` : `<span>?</span>`}
                </button>`;
              }).join(``)}
            </div>
          </div>`;
      } else if (gid === 7) {
        gameHtml = `
          <div class="card">
            <h3>Game 7: Listen & Colour</h3>
            <p>Instruction: <strong>"Colour the ${session.g7TargetShape} ${session.g7TargetCol}!"</strong>
              <button type="button" class="btn btn-audio" onclick="speakText('Colour the ${session.g7TargetShape} ${session.g7TargetCol}!')">Listen</button>
            </p>
            <div style="display:flex; gap:var(--space-lg); justify-content:center; flex-wrap:wrap; padding:var(--space-md);">
              <button type="button" class="btn btn-soft" style="min-height:90px; padding:var(--space-md); background:${session.g7Painted.star ? COLOURS[session.g7Painted.star].css : 'var(--surface-container)'};" onclick="g7Paint('star')">★ Star</button>
              <button type="button" class="btn btn-soft" style="min-height:90px; padding:var(--space-md); background:${session.g7Painted.heart ? COLOURS[session.g7Painted.heart].css : 'var(--surface-container)'};" onclick="g7Paint('heart')">♥ Heart</button>
              <button type="button" class="btn btn-soft" style="min-height:90px; padding:var(--space-md); background:${session.g7Painted.leaf ? COLOURS[session.g7Painted.leaf].css : 'var(--surface-container)'};" onclick="g7Paint('leaf')">♣ Leaf</button>
            </div>
          </div>`;
      } else if (gid === 8) {
        const r = G8_RIDDLES[session.g8Index];
        gameHtml = `
          <div class="card">
            <h3>Game 8: Mystery Colour</h3>
            <p style="font-size:1.1rem; font-weight:700;">"${r.q}" <button type="button" class="btn btn-audio" onclick="speakText(\`${r.q}\`)">Hear Clue</button></p>
            <div class="swatch-row">
              ${r.opts.map(o => `<button type="button" class="btn btn-primary" onclick="g8Answer('${o}')">${o}</button>`).join(``)}
            </div>
          </div>`;
      } else if (gid === 9) {
        gameHtml = `
          <div class="card">
            <h3>Game 9: Sort the Colours (${session.g9Sorted.length}/${G9_ITEMS.length})</h3>
            <p>Tap an item, then tap the matching colour bin!</p>
            <div class="swatch-row" style="margin-bottom:var(--space-md);">
              ${G9_ITEMS.map(it => {
                const done = session.g9Sorted.includes(it.id);
                return `<button type="button" class="draggable-chip ${session.g9Selected === it.id ? 'selected-drag' : ''}" ${done ? 'disabled' : ''} onclick="g9Select('${it.id}')">${it.label} ${done ? '✓' : ''}</button>`;
              }).join(``)}
            </div>
            <div class="grid-3">
              ${[`red`, `blue`, `green`].map(b => `
                <button type="button" class="drop-zone" style="background:${COLOURS[b].css}; color:var(--color-white); cursor:pointer;" onclick="g9DropBin('${b}')">
                  ${COLOURS[b].name} Bin
                </button>`).join(``)}
            </div>
          </div>`;
      } else if (gid === 10) {
        gameHtml = `
          <div class="card">
            <h3>Game 10: Colour Hunt (${session.g10Found.length}/4 purple gems)</h3>
            <p>Explore the meadow and collect all 4 <strong>PURPLE</strong> gems!</p>
            <div class="grid-4">
              ${[0, 1, 2, 3].map(i => {
                const found = session.g10Found.includes(i);
                return `<button type="button" class="btn ${found ? 'btn-primary' : 'btn-soft'}" style="min-height:80px;" onclick="g10Collect(${i})">
                  <span class="colour-dot" style="background:var(--color-purple);"></span> ${found ? 'Collected!' : 'Tap Purple Gem'}
                </button>`;
              }).join(``)}
            </div>
          </div>`;
      } else if (gid === 11) {
        const p = G11_PATTERNS[session.g11Index];
        gameHtml = `
          <div class="card">
            <h3>Game 11: What's Missing?</h3>
            <p style="font-size:1.15rem; font-weight:800;">${p.seq.join(` → `)}</p>
            <div class="swatch-row">
              ${p.opts.map(o => `<button type="button" class="btn btn-primary" onclick="g11Pick('${o}')">${o}</button>`).join(``)}
            </div>
          </div>`;
      } else {
        gameHtml = `
          <div class="card">
            <h3>Game 12: Colour Creator</h3>
            <p>Pick a shape and colour, then tap anywhere on the meadow canvas to stamp colourful art!</p>
            <div style="display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-bottom:var(--space-sm);">
              ${[`flower`, `star`, `circle`].map(sh => `<button type="button" class="btn ${session.g12ActiveShape === sh ? 'btn-secondary' : 'btn-soft'}" onclick="g12SetShape('${sh}')">${sh}</button>`).join(``)}
              ${[`red`, `yellow`, `blue`, `green`, `pink`, `purple`].map(c => `<button type="button" class="colour-chip ${session.g12ActiveColour === c ? 'selected' : ''}" onclick="g12SetColour('${c}')"><span class="colour-dot" style="background:${COLOURS[c].css};"></span></button>`).join(``)}
              <button type="button" class="btn btn-soft" onclick="g12Clear()">Clear</button>
            </div>
            <svg viewBox="0 0 500 240" class="scene-svg" style="background:var(--surface-container-low); border:2px solid var(--outline-variant); cursor:crosshair;" onclick="g12StampAt(event)">
              <text x="250" y="24" text-anchor="middle" font-size="13" fill="var(--on-surface-variant)">Tap anywhere to place colourful stamps!</text>
              ${session.g12Stamps.map(st => {
                if (st.shape === `flower`) return `<circle cx="${st.x}" cy="${st.y}" r="18" fill="${COLOURS[st.col].css}"/><circle cx="${st.x}" cy="${st.y}" r="6" fill="var(--color-yellow)"/>`;
                if (st.shape === `star`) return `<polygon points="${st.x},${st.y-18} ${st.x+5},${st.y-5} ${st.x+18},${st.y-5} ${st.x+8},${st.y+4} ${st.x+12},${st.y+18} ${st.x},${st.y+9} ${st.x-12},${st.y+18} ${st.x-8},${st.y+4} ${st.x-18},${st.y-5} ${st.x-5},${st.y-5}" fill="${COLOURS[st.col].css}"/>`;
                return `<circle cx="${st.x}" cy="${st.y}" r="16" fill="${COLOURS[st.col].css}"/>`;
              }).join(``)}
            </svg>
          </div>`;
      }

      return `
        <section class="hero-panel">
          <span class="kicker">Play & Practise (${appState.gamesCompleted.length}/12 Games Completed)</span>
          <h1 class="display">Interactive <em>Mini-Games</em></h1>
          <div class="pill-tabs">
            ${GAMES_LIST.map(g => `
              <button type="button" class="btn btn-nav ${gid === g.id ? 'active' : ''}" onclick="selectMiniGame(${g.id})">
                ${g.name} ${appState.gamesCompleted.includes(g.id) ? '★' : ''}
              </button>`).join(``)}
          </div>
          ${gameHtml}
        </section>
      `;
    }

    // -------------------------------------------------------------------------
    // SECTION 13: COMMUNICATION & CHAT ACTIVITIES (LILY & OLIVER)
    // -------------------------------------------------------------------------
    const CHAT_SCENARIOS = {
      1: {
        title: `1. Favourite Colours`,
        lines: [
          { who: `Oliver`, text: `Hi, Lily! What's your favourite colour?` },
          { who: `Lily`,   text: `My favourite colour is pink.` },
          { who: `Oliver`, text: `Really? I like blue!` },
          { who: `Lily`,   text: `Look at my flowers. They are pink and purple.` },
          { who: `Oliver`, text: `They are beautiful!` }
        ],
        prompt: `How can you reply to Oliver?`,
        replies: [
          `My favourite colour is green because it is beautiful!`,
          `I like yellow because I like the sun!`
        ]
      },
      2: {
        title: `2. What Colour Is It?`,
        lines: [
          { who: `Lily`,   text: `Look at that butterfly! What colour is it?` },
          { who: `Oliver`, text: `It is blue! Do you like blue?` }
        ],
        prompt: `Choose your answer:`,
        replies: [
          `Yes, I do! Blue is lovely.`,
          `No, I don't. My favourite colour is red!`
        ]
      }
    };

    function setChatScenario(num) {
      session.chatScenario = num;
      session.chatMessages = [];
      renderView();
    }

    function sendChatReply(text) {
      session.chatMessages.push({ who: `You`, text });
      playChime(`win`);
      speakText(text);
      renderView();
    }

    function renderChatView() {
      const sc = CHAT_SCENARIOS[session.chatScenario];
      const allLines = sc.lines.concat(session.chatMessages);

      return `
        <section class="hero-panel">
          <span class="kicker">English Communication Practice</span>
          <h1 class="display">Chat with <em>Lily & Oliver</em></h1>
          <p style="color:var(--on-surface-variant);">Tap any speech bubble to hear Lily and Oliver speak, then choose your reply!</p>

          <div class="pill-tabs">
            <button type="button" class="btn btn-nav ${session.chatScenario === 1 ? 'active' : ''}" onclick="setChatScenario(1)">1. Favourite Colours</button>
            <button type="button" class="btn btn-nav ${session.chatScenario === 2 ? 'active' : ''}" onclick="setChatScenario(2)">2. Questions & Answers</button>
          </div>

          <div class="chat-stream" style="margin-bottom:var(--space-md);">
            ${allLines.map(msg => {
              const isRight = msg.who === `Lily` || msg.who === `You`;
              return `
                <div class="chat-row ${isRight ? 'right' : ''}">
                  ${renderCompanionAvatar(msg.who === `Oliver` ? `Oliver` : `Lily`, 44)}
                  <div class="chat-bubble">
                    <span style="font-size:0.75rem; font-weight:800; color:var(--secondary);">${msg.who}</span>
                    <span>${msg.text}</span>
                    <div>
                      <button type="button" class="btn btn-audio" style="min-height:32px; padding:2px 10px; font-size:0.8rem;" onclick="speakText(\`${msg.text}\`)">
                        <i data-lucide="volume-2" aria-hidden="true"></i> Listen
                      </button>
                    </div>
                  </div>
                </div>`;
            }).join(``)}
          </div>

          <div class="card card-sky">
            <h3>${sc.prompt}</h3>
            <div style="display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-top:var(--space-sm);">
              ${sc.replies.map(r => `<button type="button" class="btn btn-primary" onclick="sendChatReply(\`${r}\`)">${r}</button>`).join(``)}
            </div>
          </div>
        </section>
      `;
    }

    // -------------------------------------------------------------------------
    // SECTION 16: TROPHY BOOK, STICKERS, GALLERY & CERTIFICATE
    // -------------------------------------------------------------------------
    function updateLearnerName() {
      const inp = document.getElementById(`learner-name-input`);
      if (!inp) return;
      appState.learnerName = inp.value.trim() || `Colour Explorer`;
      saveState();
      renderView();
    }

    function downloadCertificateText() {
      if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === `function`) {
        const text = `CERTIFICATE OF ACHIEVEMENT\nTHE MAGICAL WORLD OF COLOURS\n\nAwarded to: ${appState.learnerName}\nAdventure Companion: ${appState.companion}\nChapters Restored: ${appState.completedChapters.length} / 7\nRainbow Stars Earned: ${appState.stars}\n\nCongratulations, Colour Explorer!`;
        window.notebookAppApi.triggerFileDownload({
          content: text,
          contentType: `text/plain`,
          encoding: `UTF-8`,
          filename: `colour-explorer-certificate.txt`
        });
      }
    }

    function renderTrophiesView() {
      const done = appState.completedChapters.length;
      return `
        <section class="hero-panel">
          <span class="kicker">Progress & Rewards</span>
          <h1 class="display">Your <em>Trophy</em> Book & Gallery</h1>

          <!-- Sticker Book -->
          <div class="card" style="margin-bottom:var(--space-lg);">
            <h3>Collectible Chapter Stickers (${done}/7)</h3>
            <div class="grid-4" style="margin-top:var(--space-md);">
              ${CHAPTERS.map(ch => {
                const earned = appState.completedChapters.includes(ch.id);
                return `<div style="padding:var(--space-md); border-radius:var(--rounded); background:${earned ? 'var(--surface-container-low)' : 'var(--surface-container)'}; border:2px solid ${earned ? ch.colorVar : 'var(--outline-variant)'}; text-align:center;">
                  <div style="width:42px; height:42px; border-radius:9999px; margin:0 auto var(--space-xs); background:${earned ? ch.colorVar : 'var(--color-grey-light)'}; display:flex; align-items:center; justify-content:center; color:var(--color-white); font-weight:900;">${earned ? '★' : '?'}</div>
                  <strong style="font-size:0.9rem;">${ch.sticker}</strong>
                  <div style="font-size:0.78rem; color:var(--on-surface-variant);">${earned ? 'Unlocked!' : ch.title}</div>
                </div>`;
              }).join(``)}
            </div>
          </div>

          <!-- Saved Artwork Gallery -->
          <div class="card card-sky" style="margin-bottom:var(--space-lg);">
            <h3>Personal Artwork Gallery (${appState.savedArtworks.length} paintings)</h3>
            ${appState.savedArtworks.length === 0
              ? `<p style="color:var(--on-surface-variant);">No saved paintings yet! Visit <strong>Chapter 5: The Colourful Art Studio</strong> to paint and save your artwork.</p>
                 <button type="button" class="btn btn-primary" onclick="goToView('studio')">Open Art Studio</button>`
              : `<div class="grid-3" style="margin-top:var(--space-md);">
                  ${appState.savedArtworks.map((art, i) => `
                    <div style="background:var(--surface-container-low); padding:var(--space-sm); border-radius:var(--rounded); border:2px solid var(--outline-variant);">
                      ${renderArtworkSvg(art.colors, true)}
                      <div style="font-size:0.85rem; font-weight:700; margin-top:4px;">Painting #${i + 1} by ${art.artist}</div>
                    </div>`).join(``)}
                </div>`}
          </div>

          <!-- Colour Explorer Certificate -->
          <div class="certificate-frame">
            <span class="kicker" style="justify-content:center;">Official Storybook Award</span>
            <h2 style="margin:0;">Colour Explorer Certificate</h2>
            <p style="margin:0;">This certifies that</p>
            <div style="font-size:1.75rem; font-weight:900; color:var(--primary);">${appState.learnerName}</div>
            <p style="margin:0;">with companion <strong>${appState.companion}</strong>, explored Colourland, restored <strong>${done}/7</strong> magical places, and earned <strong>${appState.stars} Rainbow Stars</strong>!</p>

            <div class="field-group" style="max-width:340px; margin:0 auto;">
              <label for="learner-name-input">Your Name on the Certificate</label>
              <div style="display:flex; gap:var(--space-xs);">
                <input type="text" id="learner-name-input" value="${appState.learnerName}" style="flex:1;">
                <button type="button" class="btn btn-primary" onclick="updateLearnerName()">Update</button>
              </div>
            </div>

            <div style="display:flex; justify-content:center; gap:var(--space-sm); flex-wrap:wrap;">
              <button type="button" class="btn btn-secondary" onclick="speakText('Congratulations ${appState.learnerName}! You are a wonderful Colour Explorer!')">
                <i data-lucide="volume-2" aria-hidden="true"></i> Celebrate Aloud
              </button>
              <button type="button" class="btn btn-sky" onclick="downloadCertificateText()">
                <i data-lucide="download" aria-hidden="true"></i> Download Certificate
              </button>
              <button type="button" class="btn btn-soft" onclick="resetAllProgress(this)">Reset Progress</button>
            </div>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 7. BOOTSTRAP APPLICATION
    // =========================================================================
    async function initApp() {
      await loadState();
      renderView();
      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
        window.notebookAppApi.notifyAppReady();
      }
    }

    document.addEventListener(`DOMContentLoaded`, initApp);
  </script>
</body>
</html>
