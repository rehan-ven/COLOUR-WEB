<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="sticker">
  <title>The Magical World of Colours — Interactive English Storybook</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;

      /* Sticker base surfaces adapted to warm storybook cream paper */
      --background: #fdf7ea;
      --surface-container-low: #fffdf8;
      --surface-container: #f5ebd6;
      --surface-container-high: #ebdcc0;

      /* Storybook ink */
      --on-surface: #36221a;
      --on-surface-variant: #694e42;

      /* Outlines */
      --outline: #a38674;
      --outline-variant: #e3d3bc;

      /* Sticker primary accents */
      --primary: #c2207f;
      --on-primary: #ffffff;
      --primary-container: #f8c8e2;
      --on-primary-container: #36221a;
      --secondary: #7c52aa;
      --tertiary: #1e96d6;
      --error: #c53030;
      --on-error: #ffffff;

      /* Storybook 11-colour palette */
      --color-red: #dc3545;
      --color-yellow: #f7c927;
      --color-blue: #2393d8;
      --color-green: #38a153;
      --color-orange: #f48424;
      --color-purple: #8755c2;
      --color-pink: #eb5d9e;
      --color-black: #2b2629;
      --color-white: #ffffff;
      --color-brown: #7c4d2e;
      --color-indigo: #4640a8;
      --color-violet: #9d50d4;
      --color-cream: #fdf7ea;
      --color-sky-soft: #d9f1fc;
      --color-grass-soft: #d8f3dc;
      --color-gold: #e8a317;
      --color-grey-muted: #9a9691;
      --color-grey-light: #dad5ce;

      /* Data series */
      --data-1: #c2207f;
      --data-2: #7c52aa;
      --data-3: #1e96d6;
      --data-4: #f48424;
      --data-context: #c9b9aa;

      /* Semantic */
      --positive: #288542;
      --positive-bg: #def7e5;
      --warning: #b86800;
      --warning-bg: #fff2d6;
      --focus: #c2207f;

      /* Fonts */
      --font-headline: 'DM Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-label: 'DM Sans', sans-serif;

      /* Type scale */
      --display-size: clamp(1.85rem, 1.35rem + 1.8vw, 2.75rem);
      --headline-size: clamp(1.35rem, 1.1rem + 0.8vw, 1.85rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.35vw, 1.3rem);
      --body-size: clamp(1rem, 0.95rem + 0.2vw, 1.08rem);
      --label-size: 0.78rem;

      /* Shape */
      --rounded: 1.15rem;
      --rounded-lg: 1.85rem;
      --rounded-full: 9999px;

      /* Spacing */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.25rem;
      --space-2xl: 3.5rem;

      /* Sticker tinted shadows */
      --shadow-pink: 0 5px 18px rgb(194 32 127 / 0.16);
      --shadow-pink-deep: 0 10px 28px rgb(194 32 127 / 0.28);
      --shadow-grape: 0 5px 18px rgb(124 82 170 / 0.16);
      --shadow-sky: 0 5px 18px rgb(30 150 214 / 0.18);
      --shadow-warm: 0 5px 18px rgb(124 77 46 / 0.12);
      --pop-scale: scale(1.04);
      --lift: translateY(-4px);

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header { position: static !important; }

    /* Focus rings */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* App Shell */
    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: var(--space-md) var(--space-lg) var(--space-2xl);
      display: grid;
      gap: var(--space-lg);
    }
    .app-shell * { min-width: 0; }

    /* Top Storybook Navigation Bar */
    .storybook-header {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-pink);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .brand-btn {
      background: transparent;
      border: none;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      cursor: pointer;
      color: var(--on-surface);
      font-family: var(--font-headline);
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      text-align: left;
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .brand-btn:hover { transform: var(--pop-scale); }
    .brand-btn em { font-style: normal; color: var(--primary); }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      background: var(--surface-container);
      color: var(--on-surface);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-size: 0.875rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      align-items: center;
    }

    /* Buttons & Interactive Pills */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      border: 2px solid transparent;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform var(--dur-short) var(--ease-bounce),
                  box-shadow var(--dur-short) var(--ease-out),
                  background-color var(--dur-micro) var(--ease-out);
    }
    .btn:hover { transform: var(--pop-scale); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-pink);
    }
    .btn-primary:hover { box-shadow: var(--shadow-pink-deep); }

    .btn-secondary {
      background: var(--secondary);
      color: var(--on-primary);
      box-shadow: var(--shadow-grape);
    }

    .btn-sky {
      background: var(--tertiary);
      color: var(--on-primary);
      box-shadow: var(--shadow-sky);
    }

    .btn-soft {
      background: var(--surface-container);
      color: var(--on-surface);
    }
    .btn-soft:hover { background: var(--surface-container-high); }

    .btn-nav {
      min-height: 40px;
      padding: var(--space-xs) var(--space-md);
      font-size: 0.875rem;
      background: var(--surface-container);
      color: var(--on-surface);
    }
    .btn-nav.active {
      background: var(--primary);
      color: var(--on-primary);
      box-shadow: var(--shadow-pink);
    }

    .btn-audio {
      background: var(--surface-container);
      color: var(--primary);
      min-height: 40px;
      padding: var(--space-xs) var(--space-md);
      font-size: 0.875rem;
      border: 2px solid var(--primary-container);
    }
    .btn-audio:hover { background: var(--primary-container); color: var(--on-surface); }

    /* Cards & Containers */
    .card {
      background: var(--surface-container-low);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-pink);
      padding: var(--space-lg);
    }
    .card-sky { box-shadow: var(--shadow-sky); }
    .card-grape { box-shadow: var(--shadow-grape); }
    .card-warm { box-shadow: var(--shadow-warm); }

    .hero-panel {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-pink);
      padding: var(--space-xl);
    }

    .display {
      font-family: var(--font-headline);
      font-weight: 900;
      font-size: var(--display-size);
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 0 0 var(--space-sm);
      color: var(--on-surface);
    }
    .display em { font-style: normal; color: var(--primary); }

    h2 {
      font-family: var(--font-headline);
      font-weight: 800;
      font-size: var(--headline-size);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 var(--space-sm);
      color: var(--on-surface);
    }
    h3 {
      font-family: var(--font-headline);
      font-weight: 800;
      font-size: var(--subhead-size);
      letter-spacing: -0.015em;
      margin: 0 0 var(--space-xs);
      color: var(--on-surface);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--label-size);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--secondary);
      margin-bottom: var(--space-xs);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .badge-positive {
      background: var(--positive-bg);
      color: var(--positive);
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--surface-container-high);
      border-radius: var(--rounded-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-red), var(--color-orange), var(--color-yellow), var(--color-green), var(--color-blue), var(--color-purple));
      border-radius: var(--rounded-full);
      transition: width var(--dur-long) var(--ease-out);
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-md);
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
      gap: var(--space-md);
    }

    /* Inputs with always-visible labels */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .field-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--on-surface-variant);
    }
    input[type="text"], select {
      min-height: 44px;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      border: 2px solid var(--outline);
      background: var(--surface-container);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
    }
    select { padding-right: var(--space-xl); }
    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      outline: 3px solid var(--primary-container);
    }

    /* Feedback Banner */
    .feedback-box {
      padding: var(--space-md) var(--space-lg);
      border-radius: var(--rounded);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
      background: var(--surface-container);
      color: var(--on-surface);
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .feedback-box.success {
      background: var(--positive-bg);
      color: var(--positive);
    }
    .feedback-box.hint {
      background: var(--warning-bg);
      color: var(--warning);
    }

    /* Colour Swatch Chips */
    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .colour-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      min-height: 44px;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      border: 3px solid var(--surface-container-high);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out);
    }
    .colour-chip:hover { transform: var(--pop-scale); }
    .colour-chip.selected {
      border-color: var(--primary);
      box-shadow: var(--shadow-pink);
      transform: var(--pop-scale);
    }
    .colour-dot {
      width: 22px;
      height: 22px;
      border-radius: var(--rounded-full);
      border: 2px solid var(--outline-variant);
      flex-shrink: 0;
    }

    /* Interactive SVG Scene Container */
    .scene-frame {
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      padding: var(--space-md);
      position: relative;
      overflow: hidden;
    }
    .scene-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--rounded);
      user-select: none;
    }
    .interactive-obj {
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce), filter var(--dur-short) var(--ease-out);
      transform-box: fill-box;
      transform-origin: center;
    }
    .interactive-obj:hover {
      transform: scale(1.07);
      filter: drop-shadow(0 4px 8px rgb(54 34 26 / 0.22));
    }
    .interactive-obj.highlighted {
      filter: drop-shadow(0 0 10px var(--primary));
      transform: scale(1.09);
    }

    /* Colourless vs Restored transition */
    .greyscale-mode {
      filter: grayscale(0.88) saturate(0.25);
      transition: filter var(--dur-long) var(--ease-out);
    }
    .restored-mode {
      filter: grayscale(0) saturate(1.05);
      transition: filter var(--dur-long) var(--ease-out);
    }

    /* Subtle Storybook Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes flutter {
      0%, 100% { transform: translate(0px, 0px) rotate(-3deg); }
      50% { transform: translate(5px, -8px) rotate(5deg); }
    }
    @keyframes dropFall {
      0% { transform: translateY(-6px); opacity: 0.9; }
      50% { transform: translateY(8px); opacity: 1; }
      100% { transform: translateY(-6px); opacity: 0.9; }
    }
    .anim-float { animation: floatSlow 3.4s ease-in-out infinite; }
    .anim-flutter { animation: flutter 2.8s ease-in-out infinite; }
    .anim-drop { animation: dropFall 2.4s ease-in-out infinite; }

    /* Companion Cards */
    .companion-card {
      background: var(--surface-container-low);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      border: 3px solid var(--outline-variant);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--space-md);
      text-align: left;
      transition: transform var(--dur-short) var(--ease-bounce), border-color var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
    }
    .companion-card:hover { transform: var(--lift); }
    .companion-card.selected {
      border-color: var(--primary);
      box-shadow: var(--shadow-pink-deep);
      background: var(--surface-container-low);
    }

    /* Chapter Header Bar */
    .chapter-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    /* Drag & Drop Zones */
    .drop-zone {
      min-height: 76px;
      border: 3px dashed var(--outline);
      border-radius: var(--rounded);
      background: var(--surface-container);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-sm);
      gap: var(--space-xs);
      font-weight: 700;
      text-align: center;
      transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    }
    .drop-zone.drag-over {
      background: var(--primary-container);
      border-color: var(--primary);
    }

    .draggable-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      background: var(--surface-container-low);
      border: 2px solid var(--outline);
      font-weight: 700;
      cursor: grab;
      user-select: none;
      box-shadow: var(--shadow-warm);
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .draggable-chip:hover { transform: var(--pop-scale); }
    .draggable-chip.selected-drag {
      border-color: var(--primary);
      background: var(--primary-container);
    }

    /* Paint Lab Bowl */
    .mixing-bowl-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
    }
    .paint-slot-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .paint-slot {
      width: 94px;
      height: 94px;
      border-radius: var(--rounded-full);
      border: 3px dashed var(--outline);
      background: var(--surface-container);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .paint-slot:hover { transform: var(--pop-scale); }

    /* Chat Bubbles */
    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      padding: var(--space-md);
      background: var(--surface-container);
      border-radius: var(--rounded-lg);
      max-height: 440px;
      overflow-y: auto;
    }
    .chat-row {
      display: flex;
      align-items: flex-end;
      gap: var(--space-sm);
      max-width: 85%;
    }
    .chat-row.right {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-bubble {
      background: var(--surface-container-low);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      box-shadow: var(--shadow-warm);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }
    .chat-row.right .chat-bubble {
      background: var(--primary-container);
    }

    /* Memory Cards */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: var(--space-sm);
    }
    .memory-card {
      min-height: 100px;
      border-radius: var(--rounded);
      border: 3px solid var(--outline-variant);
      background: var(--surface-container);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: var(--space-sm);
      transition: transform var(--dur-short) var(--ease-bounce);
    }
    .memory-card:hover { transform: var(--pop-scale); }
    .memory-card.flipped { background: var(--surface-container-low); border-color: var(--primary); }
    .memory-card.matched { background: var(--positive-bg); border-color: var(--positive); color: var(--positive); }

    /* Sub-tabs inside Missions / Games */
    .pill-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    /* Hidden utility */
    .hidden { display: none !important; }

    /* Certificate card */
    .certificate-frame {
      background: var(--surface-container-low);
      border: 6px double var(--color-gold);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      text-align: center;
      box-shadow: var(--shadow-warm);
      display: grid;
      gap: var(--space-md);
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .app-shell { padding: var(--space-sm); gap: var(--space-md); }
      .storybook-header { padding: var(--space-sm) var(--space-md); }
      .hero-panel { padding: var(--space-lg) var(--space-md); }
      .card { padding: var(--space-md); }
      .chat-row { max-width: 96%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Persistent Storybook Header -->
    <header class="storybook-header" aria-label="Storybook Navigation">
      <div class="brand-group">
        <button type="button" class="brand-btn" onclick="goToView('story')" title="Go to Opening Story">
          <i data-lucide="palette" aria-hidden="true"></i>
          <span>The Magical World of <em>Colours</em></span>
        </button>
      </div>

      <nav class="nav-bar" aria-label="Main Sections">
        <button type="button" class="btn btn-nav" id="nav-story" onclick="goToView('story')">
          <i data-lucide="book-open" aria-hidden="true"></i> Story
        </button>
        <button type="button" class="btn btn-nav" id="nav-map" onclick="goToView('map')">
          <i data-lucide="map" aria-hidden="true"></i> Adventure Map
        </button>
        <button type="button" class="btn btn-nav" id="nav-missions" onclick="goToView('missions')">
          <i data-lucide="compass" aria-hidden="true"></i> Everyday Life
        </button>
        <button type="button" class="btn btn-nav" id="nav-games" onclick="goToView('games')">
          <i data-lucide="gamepad-2" aria-hidden="true"></i> Mini-Games
        </button>
        <button type="button" class="btn btn-nav" id="nav-chat" onclick="goToView('chat')">
          <i data-lucide="message-circle" aria-hidden="true"></i> Chat
        </button>
        <button type="button" class="btn btn-nav" id="nav-trophies" onclick="goToView('trophies')">
          <i data-lucide="award" aria-hidden="true"></i> Trophy Book
        </button>
      </nav>

      <div class="status-strip">
        <span class="stat-pill" id="companion-pill" title="Your Adventure Companion">
          <i data-lucide="user-check" aria-hidden="true"></i>
          <span id="companion-label">Lily</span>
        </span>
        <span class="stat-pill" title="Restored Locations">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span id="restored-count">0/7 Restored</span>
        </span>
        <span class="stat-pill" title="Rainbow Stars">
          <i data-lucide="star" aria-hidden="true"></i>
          <span id="stars-count">0 Stars</span>
        </span>
        <button type="button" class="btn btn-soft" id="sound-toggle-btn" onclick="toggleSound()" aria-pressed="true" style="min-height:38px; padding: 0.25rem 0.75rem;">
          <i data-lucide="volume-2" aria-hidden="true"></i>
          <span id="sound-label">Sound On</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" tabindex="-1"></main>
  </div>

  <api-shim></api-shim>
  <script>
    // =========================================================================
    // 1. CORE DATA & PALETTE (using CSS variables so zero inline hex in body)
    // =========================================================================
    const COLOURS = {
      red:    { name: `Red`,    css: `var(--color-red)`,    textLight: true,  example: `apple` },
      yellow: { name: `Yellow`, css: `var(--color-yellow)`, textLight: false, example: `sun` },
      blue:   { name: `Blue`,   css: `var(--color-blue)`,   textLight: true,  example: `butterfly` },
      green:  { name: `Green`,  css: `var(--color-green)`,  textLight: true,  example: `tree` },
      orange: { name: `Orange`, css: `var(--color-orange)`, textLight: false, example: `carrot` },
      purple: { name: `Purple`, css: `var(--color-purple)`, textLight: true,  example: `grapes` },
      pink:   { name: `Pink`,   css: `var(--color-pink)`,   textLight: true,  example: `mushroom` },
      black:  { name: `Black`,  css: `var(--color-black)`,  textLight: true,  example: `crow` },
      white:  { name: `White`,  css: `var(--color-white)`,  textLight: false, example: `cloud` },
      brown:  { name: `Brown`,  css: `var(--color-brown)`,  textLight: true,  example: `coconut` },
      indigo: { name: `Indigo`, css: `var(--color-indigo)`, textLight: true,  example: `night sky` },
      violet: { name: `Violet`, css: `var(--color-violet)`, textLight: true,  example: `violet flower` }
    };

    const CHAPTERS = [
      { id: `garden`,  num: 1, title: `The Colour Garden`,        subtitle: `Basic colours & garden objects`,     sticker: `Garden Butterfly`,   colorVar: `var(--color-red)` },
      { id: `forest`,  num: 2, title: `The Rainbow Forest`,       subtitle: `Nature detective & sentences`,       sticker: `Forest Songbird`,    colorVar: `var(--color-green)` },
      { id: `lab`,     num: 3, title: `The Magic Paint Lab`,      subtitle: `Mix primary & secondary colours`,    sticker: `Magic Paint Potion`, colorVar: `var(--color-purple)` },
      { id: `market`,  num: 4, title: `The Colourful Fruit Market`, subtitle: `Fruits, counting & shopping`,      sticker: `Sweet Fruit Basket`, colorVar: `var(--color-orange)` },
      { id: `studio`,  num: 5, title: `The Colourful Art Studio`, subtitle: `Paint your own storybook canvas`,    sticker: `Artist Palette`,     colorVar: `var(--color-pink)` },
      { id: `toys`,    num: 6, title: `The Toy Wonderland`,       subtitle: `Toys, preferences & mystery box`,    sticker: `Sunny Teddy Bear`,   colorVar: `var(--color-yellow)` },
      { id: `castle`,  num: 7, title: `The Rainbow Castle`,       subtitle: `7 rainbow colours & the bridge`,     sticker: `Rainbow Crown`,      colorVar: `var(--color-blue)` }
    ];

    // Persistent Application State
    let appState = {
      currentView: `story`,
      companion: `Lily`,
      learnerName: `Colour Explorer`,
      soundEnabled: true,
      completedChapters: [],
      stars: 0,
      savedArtworks: [],
      currentCanvasColors: {
        sky: `white`,
        sun: `white`,
        roof: `white`,
        wall: `white`,
        door: `white`,
        window: `white`,
        tree: `white`,
        grass: `white`,
        flower1: `white`,
        flower2: `white`
      },
      missions: {
        aroundMe: [],
        aroundMeNote: ``,
        favColour: `purple`,
        favReason: `Because it is beautiful.`,
        outfit: { hat: `pink`, shirt: `red`, trousers: `blue`, shoes: `green` },
        classroomFound: [],
        classroomNote: ``,
        collection: { red: `Red Apple`, blue: `Blue Butterfly`, green: `Green Leaf`, yellow: `Yellow Sun` }
      },
      gamesCompleted: [],
      activeMissionTab: 1,
      activeGameId: 1
    };

    // Ephemeral activity state (per-view progress)
    let session = {
      gardenStep: 0,
      gardenMode: `explore`,
      gardenHighlighted: null,
      gardenSelectedLabel: null,
      gardenMatchedLabels: [],
      forestFoundGreen: [],
      forestSentence1: ``,
      forestSentence2: ``,
      labSlotA: null,
      labSlotB: null,
      labMixResult: null,
      labDiscovered: [],
      marketBasket: [],
      marketOrderIndex: 0,
      marketDialogueStep: 0,
      studioSelectedColour: `yellow`,
      studioGuidedDone: [],
      toyRiddleIndex: 0,
      toyLikedGreen: null,
      toyGift: null,
      castleMissingChoice: null,
      castleBridge: [null, null, null, null, null, null, null],
      castleSelectedBlock: null,
      chatScenario: 1,
      chatMessages: [],
      // Mini-games ephemeral states
      g1Target: `red`, g1Popped: 0,
      g2SelectedObj: null, g2Matched: [],
      g3Found: [],
      g4Order: [`blue`, `red`, `yellow`, `violet`, `green`, `orange`, `indigo`], g4Picked: null,
      g5Target: `purple`, g5Picks: [],
      g6Cards: [], g6Flipped: [], g6Matched: [],
      g7TargetShape: `star`, g7TargetCol: `yellow`, g7Painted: {},
      g8Index: 0,
      g9Selected: null, g9Sorted: [],
      g10Found: [],
      g11Index: 0,
      g12Stamps: [], g12ActiveColour: `red`, g12ActiveShape: `flower`
    };

    // =========================================================================
    // 2. AUDIO ENGINE (Web Speech API + Web Audio API Sound Effects)
    // =========================================================================
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === `suspended`) {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playChime(type) {
      if (!appState.soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const notes = type === `win` ? [523.25, 659.25, 783.99, 1046.5]
                  : type === `pop` ? [660, 880]
                  : type === `hint` ? [330, 293.66]
                  : [587.33, 783.99];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type === `hint` ? `triangle` : `sine`;
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.001, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.11, now + idx * 0.08 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.24);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.26);
      });
    }

    function speakText(text) {
      if (!appState.soundEnabled) return;
      if (typeof window.speechSynthesis === `undefined`) {
        playChime(`tap`);
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = `en-GB`;
        utter.rate = 0.92;
        utter.pitch = 1.08;
        const voices = window.speechSynthesis.getVoices();
        const engVoice = voices.find(v => v.lang && v.lang.startsWith(`en`));
        if (engVoice) utter.voice = engVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        playChime(`tap`);
      }
    }

    function toggleSound() {
      appState.soundEnabled = !appState.soundEnabled;
      if (!appState.soundEnabled && typeof window.speechSynthesis !== `undefined`) {
        window.speechSynthesis.cancel();
      }
      updateHeaderStatus();
      saveState();
      if (appState.soundEnabled) {
        playChime(`pop`);
        speakText(`Sound is on!`);
      }
    }

    // =========================================================================
    // 3. STATE PERSISTENCE VIA GEMINI NOTEBOOK SHIM API
    // =========================================================================
    async function saveState() {
      if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
        try {
          await window.notebookAppApi.setAppState(appState);
        } catch (e) {
          // ignore sandbox save errors gracefully
        }
      }
    }

    async function loadState() {
      if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
        try {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            appState = Object.assign({}, appState, saved);
            if (saved.missions) appState.missions = Object.assign({}, appState.missions, saved.missions);
            if (saved.currentCanvasColors) appState.currentCanvasColors = Object.assign({}, appState.currentCanvasColors, saved.currentCanvasColors);
          }
        } catch (e) {
          // start fresh if unavailable
        }
      }
    }

    function completeChapter(chapterId) {
      if (!appState.completedChapters.includes(chapterId)) {
        appState.completedChapters.push(chapterId);
        appState.stars += 3;
        playChime(`win`);
      } else {
        playChime(`pop`);
      }
      updateHeaderStatus();
      saveState();
    }

    function awardGameStar(gameId) {
      if (!appState.gamesCompleted.includes(gameId)) {
        appState.gamesCompleted.push(gameId);
        appState.stars += 1;
      }
      playChime(`win`);
      updateHeaderStatus();
      saveState();
    }

    function resetAllProgress(btn) {
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `Click again to confirm reset`;
        return;
      }
      appState.completedChapters = [];
      appState.stars = 0;
      appState.savedArtworks = [];
      appState.gamesCompleted = [];
      appState.missions.aroundMe = [];
      appState.missions.classroomFound = [];
      session.labDiscovered = [];
      session.gardenStep = 0;
      session.forestFoundGreen = [];
      session.castleBridge = [null, null, null, null, null, null, null];
      saveState();
      updateHeaderStatus();
      renderView();
    }

    // =========================================================================
    // 4. NAVIGATION & HEADER UPDATES
    // =========================================================================
    function goToView(viewName) {
      appState.currentView = viewName;
      saveState();
      renderView();
      const main = document.getElementById(`main-content`);
      if (main) main.focus();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    function updateHeaderStatus() {
      const compLabel = document.getElementById(`companion-label`);
      if (compLabel) compLabel.textContent = appState.companion;

      const restoredEl = document.getElementById(`restored-count`);
      if (restoredEl) restoredEl.textContent = `${appState.completedChapters.length}/7 Restored`;

      const starsEl = document.getElementById(`stars-count`);
      if (starsEl) starsEl.textContent = `${appState.stars} Stars`;

      const soundBtn = document.getElementById(`sound-toggle-btn`);
      const soundLabel = document.getElementById(`sound-label`);
      if (soundBtn && soundLabel) {
        soundBtn.setAttribute(`aria-pressed`, String(appState.soundEnabled));
        soundLabel.textContent = appState.soundEnabled ? `Sound On` : `Muted`;
      }

      const navMap = [`story`, `map`, `missions`, `games`, `chat`, `trophies`];
      navMap.forEach(id => {
        const el = document.getElementById(`nav-${id}`);
        if (!el) return;
        const isActive = appState.currentView === id || (id === `map` && CHAPTERS.some(c => c.id === appState.currentView));
        el.classList.toggle(`active`, isActive);
      });
    }

    function setCompanion(name) {
      appState.companion = name;
      playChime(`pop`);
      speakText(`Hi! I am ${name}. Let us explore Colourland together!`);
      updateHeaderStatus();
      saveState();
      renderView();
    }

    function startAdventure() {
      playChime(`win`);
      speakText(`Let us restore the colours of Colourland!`);
      goToView(`map`);
    }

    // =========================================================================
    // 5. SHARED SVG CHARACTER & STORYBOOK ILLUSTRATIONS
    // =========================================================================
    function renderCompanionAvatar(name, size) {
      const s = size || 64;
      if (name === `Oliver`) {
        return `<svg width="${s}" height="${s}" viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="40" r="36" fill="var(--color-sky-soft)"/>
          <circle cx="40" cy="42" r="22" fill="var(--surface-container-high)"/>
          <path d="M18 36 C18 16, 62 16, 62 36 C56 26, 24 26, 18 36 Z" fill="var(--color-brown)"/>
          <circle cx="33" cy="42" r="3" fill="var(--on-surface)"/>
          <circle cx="47" cy="42" r="3" fill="var(--on-surface)"/>
          <path d="M34 51 Q40 56 46 51" stroke="var(--color-red)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M24 68 C24 58, 56 58, 56 68 Z" fill="var(--color-blue)"/>
        </svg>`;
      }
      return `<svg width="${s}" height="${s}" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="36" fill="var(--primary-container)"/>
        <circle cx="20" cy="34" r="9" fill="var(--color-orange)"/>
        <circle cx="60" cy="34" r="9" fill="var(--color-orange)"/>
        <circle cx="40" cy="42" r="22" fill="var(--surface-container-low)"/>
        <path d="M18 36 C20 14, 60 14, 62 36 C52 24, 28 24, 18 36 Z" fill="var(--color-orange)"/>
        <circle cx="33" cy="42" r="3" fill="var(--on-surface)"/>
        <circle cx="47" cy="42" r="3" fill="var(--on-surface)"/>
        <path d="M34 51 Q40 56 46 51" stroke="var(--color-pink)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M24 68 C24 58, 56 58, 56 68 Z" fill="var(--color-pink)"/>
      </svg>`;
    }

    function chapterHeaderHtml(chapterId, title, subtitle) {
      const done = appState.completedChapters.includes(chapterId);
      return `
        <div class="chapter-topbar">
          <div>
            <button type="button" class="btn btn-soft" onclick="goToView('map')">
              <i data-lucide="arrow-left" aria-hidden="true"></i> Back to Map
            </button>
          </div>
          <div style="text-align:center; flex:1;">
            <span class="kicker">Chapter Adventure</span>
            <h2 style="margin:0;">${title}</h2>
            <p style="margin:0; color:var(--on-surface-variant); font-size:0.95rem;">${subtitle}</p>
          </div>
          <div>
            ${done
              ? `<span class="badge badge-positive"><i data-lucide="check-circle" aria-hidden="true"></i> Restored!</span>`
              : `<span class="badge"><i data-lucide="sparkles" aria-hidden="true"></i> Ready to Explore</span>`}
          </div>
        </div>`;
    }

    // =========================================================================
    // 6. VIEW RENDERERS
    // =========================================================================
    function renderView() {
      const main = document.getElementById(`main-content`);
      if (!main) return;

      const v = appState.currentView;
      if (v === `story`) main.innerHTML = renderStoryView();
      else if (v === `map`) main.innerHTML = renderMapView();
      else if (v === `garden`) main.innerHTML = renderGardenChapter();
      else if (v === `forest`) main.innerHTML = renderForestChapter();
      else if (v === `lab`) main.innerHTML = renderLabChapter();
      else if (v === `market`) main.innerHTML = renderMarketChapter();
      else if (v === `studio`) main.innerHTML = renderStudioChapter();
      else if (v === `toys`) main.innerHTML = renderToysChapter();
      else if (v === `castle`) main.innerHTML = renderCastleChapter();
      else if (v === `missions`) main.innerHTML = renderMissionsView();
      else if (v === `games`) main.innerHTML = renderGamesView();
      else if (v === `chat`) main.innerHTML = renderChatView();
      else if (v === `trophies`) main.innerHTML = renderTrophiesView();
      else main.innerHTML = renderStoryView();

      updateHeaderStatus();
      if (window.lucide && typeof window.lucide.createIcons === `function`) {
        window.lucide.createIcons();
      }
    }

    // -------------------------------------------------------------------------
    // VIEW A: OPENING STORY — THE LOST COLOURS
    // -------------------------------------------------------------------------
    function renderStoryView() {
      const restoredCount = appState.completedChapters.length;
      const pct = Math.round((restoredCount / 7) * 100);
      const sceneClass = restoredCount === 0 ? `greyscale-mode` : `restored-mode`;

      const storyText = `Welcome to Colourland! Something magical has happened! One morning, Lily and Oliver discover that the colours of their beautiful town have disappeared. The flowers are grey, the trees have lost their green leaves, and the rainbow is completely colourless! The Colour Fairy needs your help. Together, you must explore different places, discover colours, mix magical paints, and bring Colourland back to life. Are you ready to become a Colour Explorer?`;

      return `

              </p>

              </div>

              <div>
                <div style="display:flex; justify-content:space-between; font-size:0.875rem; font-weight:700; margin-bottom:var(--space-xs);">

                  <span>${pct}% (${restoredCount}/7 chapters)</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width:${pct}%"></div>
                </div>
              </div>
            </div>

            <!-- Illustrated Storybook Town Scene -->
            <div class="scene-frame">
              <svg viewBox="0 0 560 380" class="scene-svg" role="img" aria-label="Illustrated town of Colourland with Lily, Oliver, the Colour Fairy, rainbow, garden, houses and paint lab">

                <path d="M 70 230 A 210 175 0 0 1 490 230" fill="none" stroke="${restoredCount >= 1 ? 'var(--color-red)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 80 230 A 200 165 0 0 1 480 230" fill="none" stroke="${restoredCount >= 2 ? 'var(--color-orange)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 90 230 A 190 155 0 0 1 470 230" fill="none" stroke="${restoredCount >= 3 ? 'var(--color-yellow)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 100 230 A 180 145 0 0 1 460 230" fill="none" stroke="${restoredCount >= 4 ? 'var(--color-green)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 110 230 A 170 135 0 0 1 450 230" fill="none" stroke="${restoredCount >= 5 ? 'var(--color-blue)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 120 230 A 160 125 0 0 1 440 230" fill="none" stroke="${restoredCount >= 6 ? 'var(--color-indigo)' : 'var(--color-grey-muted)'}" stroke-width="10"/>
                <path d="M 130 230 A 150 115 0 0 1 430 230" fill="none" stroke="${restoredCount >= 7 ? 'var(--color-violet)' : 'var(--color-grey-muted)'}" stroke-width="10"/>

                <!-- Rolling Hills -->
                <path d="M0 245 Q140 205 280 240 T560 235 L560 380 L0 380 Z" fill="${restoredCount >= 1 ? 'var(--color-grass-soft)' : 'var(--color-grey-light)'}"/>
                <path d="M0 285 Q200 255 380 295 T560 280 L560 380 L0 380 Z" fill="${restoredCount >= 2 ? 'var(--color-green)' : 'var(--color-grey-muted)'}" opacity="0.35"/>

                <!-- Houses & Paint Lab -->
                <g class="${restoredCount >= 4 ? 'restored-mode' : 'greyscale-mode'}">
                  <rect x="45" y="185" width="76" height="65" rx="6" fill="var(--color-cream)" stroke="var(--on-surface)" stroke-width="2.5"/>
                  <polygon points="38,188 83,150 128,188" fill="var(--color-red)" stroke="var(--on-surface)" stroke-width="2.5"/>
                  <rect x="73" y="214" width="20" height="36" rx="4" fill="var(--color-brown)"/>
                  <rect x="425" y="180" width="84" height="70" rx="8" fill="var(--primary-container)" stroke="var(--on-surface)" stroke-width="2.5"/>
                  <polygon points="418,182 467,142 516,182" fill="var(--color-purple)" stroke="var(--on-surface)" stroke-width="2.5"/>
                  <circle cx="467" cy="212" r="14" fill="var(--color-yellow)" stroke="var(--on-surface)" stroke-width="2"/>
                </g>

                <!-- Garden flowers waiting for colours -->
                <g class="${restoredCount >= 1 ? 'restored-mode' : 'greyscale-mode'}">
                  <line x1="155" y1="335" x2="155" y2="305" stroke="var(--color-green)" stroke-width="4" stroke-linecap="round"/>
                  <circle cx="155" cy="300" r="10" fill="var(--color-pink)"/>

    // -------------------------------------------------------------------------
    // VIEW B: INTERACTIVE ADVENTURE MAP (7 DESTINATIONS)
    // -------------------------------------------------------------------------
    function renderMapView() {
      const doneCount = appState.completedChapters.length;
      const pct = Math.round((doneCount / 7) * 100);

      const coords = [
        { id: `garden`, x: 95,  y: 235 },
        { id: `forest`, x: 205, y: 120 },
        { id: `lab`,    x: 345, y: 200 },
        { id: `market`, x: 465, y: 105 },
        { id: `studio`, x: 585, y: 215 },
        { id: `toys`,   x: 705, y: 120 },
        { id: `castle`, x: 815, y: 205 }
      ];

      const mapNodes = coords.map((pt, i) => {
        const ch = CHAPTERS[i];
        const isDone = appState.completedChapters.includes(ch.id);
        return `
          <g class="interactive-obj" onclick="goToView('${ch.id}')" role="button" tabindex="0" aria-label="Enter Chapter ${ch.num}: ${ch.title}">
            <circle cx="${pt.x}" cy="${pt.y}" r="36" fill="${isDone ? ch.colorVar : 'var(--surface-container-low)'}" stroke="${isDone ? 'var(--on-surface)' : 'var(--outline)'}" stroke-width="3.5"/>
            <text x="${pt.x}" y="${pt.y + 6}" text-anchor="middle" font-size="20" font-weight="900" fill="${isDone && ch.id !== 'toys' ? 'var(--color-white)' : 'var(--on-surface)'}">${ch.num}</text>
            <rect x="${pt.x - 62}" y="${pt.y + 42}" width="124" height="28" rx="14" fill="var(--surface-container-low)" stroke="${isDone ? ch.colorVar : 'var(--outline-variant)'}" stroke-width="2"/>
            <text x="${pt.x}" y="${pt.y + 60}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--on-surface)">${ch.title.replace('The ', '')}</text>
            ${isDone ? `<circle cx="${pt.x + 26}" cy="${pt.y - 26}" r="12" fill="var(--color-yellow)" stroke="var(--on-surface)" stroke-width="2"/><text x="${pt.x + 26}" y="${pt.y - 22}" text-anchor="middle" font-size="12" font-weight="900" fill="var(--on-surface)">★</text>` : ``}
          </g>`;
      }).join(``);

      const cardsHtml = CHAPTERS.map(ch => {
        const isDone = appState.completedChapters.includes(ch.id);
        return `
          <article class="card" style="display:flex; flex-direction:column; justify-content:space-between; gap:var(--space-sm); border-top: 6px solid ${isDone ? ch.colorVar : 'var(--outline-variant)'};">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-xs);">
                <span class="kicker">Chapter ${ch.num}</span>
                ${isDone ? `<span class="badge badge-positive">Restored ★</span>` : `<span class="badge">Sticker: ${ch.sticker}</span>`}
              </div>
              <h3>${ch.title}</h3>
              <p style="margin:0; font-size:0.92rem; color:var(--on-surface-variant);">${ch.subtitle}</p>
            </div>
            <button type="button" class="btn ${isDone ? 'btn-soft' : 'btn-primary'}" onclick="goToView('${ch.id}')">
              <i data-lucide="${isDone ? 'rotate-ccw' : 'compass'}" aria-hidden="true"></i>
              ${isDone ? 'Play Again' : 'Explore Chapter'}
            </button>
          </article>`;
      }).join(``);

      return `
        <section class="hero-panel">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:var(--space-md); margin-bottom:var(--space-md);">

              <span class="kicker">Colourland World Map</span>
              <h1 class="display" style="margin-bottom:4px;">Choose Your <em>Adventure</em></h1>
              <p style="margin:0; color:var(--on-surface-variant);">Tap any destination on the map to restore its colours and earn a sticker!</p>

            <div style="min-width:240px;">
              <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-weight:700; margin-bottom:4px;">
                <span>Map Restored</span><span>${pct}%</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
          </div>

          <div class="scene-frame" style="margin-bottom:var(--space-lg);">
            <svg viewBox="0 0 910 340" class="scene-svg" role="img" aria-label="Interactive Map of Colourland with 7 destinations">

              <path d="M0 170 Q220 120 450 175 T910 155 L910 340 L0 340 Z" fill="${doneCount >= 1 ? 'var(--color-grass-soft)' : 'var(--surface-container-high)'}"/>

              <path d="M 95 235 Q 150 130 205 120 T 345 200 T 465 105 T 585 215 T 705 120 T 815 205"
                    fill="none" stroke="var(--surface-container-low)" stroke-width="18" stroke-linecap="round"/>
              <path d="M 95 235 Q 150 130 205 120 T 345 200 T 465 105 T 585 215 T 705 120 T 815 205"
                    fill="none" stroke="var(--outline)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
              ${mapNodes}
            </svg>
          </div>

          <div class="grid-4">${cardsHtml}</div>
        </section>
      `;
    }

    // -------------------------------------------------------------------------
    // CHAPTER 1: THE COLOUR GARDEN
    // -------------------------------------------------------------------------
    const GARDEN_OBJECTS = [
      { id: `flower`,    colour: `red`,    label: `Red Flower`,    phrase: `It is a red flower! Red.` },
      { id: `butterfly`, colour: `blue`,   label: `Blue Butterfly`,phrase: `It is a blue butterfly! Blue.` },
      { id: `sun`,       colour: `yellow`, label: `Yellow Sun`,    phrase: `It is a yellow sun! Yellow.` },
      { id: `leaf`,      colour: `green`,  label: `Green Leaf`,    phrase: `It is a green leaf! Green.` },
      { id: `carrot`,    colour: `orange`, label: `Orange Carrot`, phrase: `It is an orange carrot! Orange.` },
      { id: `tulip`,     colour: `purple`, label: `Purple Flower`, phrase: `It is a purple flower! Purple.` },
      { id: `mushroom`,  colour: `pink`,   label: `Pink Mushroom`, phrase: `It is a pink mushroom! Pink.` },
      { id: `crow`,      colour: `black`,  label: `Black Bird`,    phrase: `It is a black bird! Black.` },
      { id: `cloud`,     colour: `white`,  label: `White Cloud`,   phrase: `It is a white cloud! White.` },
      { id: `trunk`,     colour: `brown`,  label: `Brown Tree`,    phrase: `It is a brown tree trunk! Brown.` }
    ];
    const GARDEN_QUESTS = [`red`, `blue`, `yellow`, `green`, `pink`, `brown`];

    function gardenClickObj(objId) {
      const obj = GARDEN_OBJECTS.find(o => o.id === objId);
      if (!obj) return;
      const fb = document.getElementById(`garden-feedback`);

      if (session.gardenMode === `explore`) {
        playChime(`pop`);
        speakText(obj.phrase);
        session.gardenHighlighted = obj.colour;
        if (fb) {
          fb.className = `feedback-box success`;
          fb.innerHTML = `<span>${obj.phrase}</span><button type="button" class="btn btn-audio" onclick="speakText(\`${obj.phrase}\`)">Hear Again</button>`;
        }
        renderGardenHighlight();
      } else if (session.gardenMode === `quest`) {
        const target = GARDEN_QUESTS[session.gardenStep];
        if (obj.colour === target) {
          playChime(`win`);
          const msg = `Wonderful! You found something ${target}!`;
          speakText(msg);
          session.gardenStep++;
          if (session.gardenStep >= GARDEN_QUESTS.length) {
            completeChapter(`garden`);
            renderView();
          } else {
            renderView();
            const nfb = document.getElementById(`garden-feedback`);
            if (nfb) {
              nfb.className = `feedback-box success`;
              nfb.textContent = msg;
            }
          }
        } else {
          playChime(`hint`);
          const msg = `That is ${obj.colour}! Try to find something ${target}.`;
          speakText(msg);
          if (fb) {
            fb.className = `feedback-box hint`;
            fb.textContent = msg;
          }
        }
      } else if (session.gardenMode === `match`) {
        if (!session.gardenSelectedLabel) {
          if (fb) { fb.className = `feedback-box hint`; fb.textContent = `First pick a colour label below, then tap its matching object!`; }
          return;
        }
        if (obj.colour === session.gardenSelectedLabel) {
          if (!session.gardenMatchedLabels.includes(obj.colour)) {
            session.gardenMatchedLabels.push(obj.colour);
          }
          session.gardenSelectedLabel = null;
          playChime(`win`);
          speakText(`Great match! ${obj.label}!`);
          if (session.gardenMatchedLabels.length >= 6) {
            completeChapter(`garden`);
          }
          renderView();
        } else {
          playChime(`hint`);
          speakText(`Almost there! Try another object.`);
          if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Almost there! That is ${obj.colour}.`; }
        }
      }
    }

    function gardenSelectHighlight(colour) {
      session.gardenHighlighted = colour;
      playChime(`pop`);
      speakText(COLOURS[colour].name);
      renderGardenHighlight();
    }

    function renderGardenHighlight() {
      GARDEN_OBJECTS.forEach(o => {
        const el = document.getElementById(`g-obj-${o.id}`);
        if (el) el.classList.toggle(`highlighted`, session.gardenHighlighted === o.colour);
      });
    }

    function setGardenMode(mode) {
      session.gardenMode = mode;
      session.gardenHighlighted = null;
      renderView();
    }

    function pickGardenLabel(colour) {
      session.gardenSelectedLabel = colour;
      playChime(`pop`);
      speakText(COLOURS[colour].name);
      renderView();
    }

    function renderGardenChapter() {
      const swatches = Object.keys(COLOURS).slice(0, 10).map(k => `
        <button type="button" class="colour-chip ${session.gardenHighlighted === k ? 'selected' : ''}" onclick="gardenSelectHighlight('${k}')">
          <span class="colour-dot" style="background:${COLOURS[k].css};"></span>
          <span>${COLOURS[k].name}</span>
        </button>`).join(``);

      const currentQuest = GARDEN_QUESTS[Math.min(session.gardenStep, GARDEN_QUESTS.length - 1)];
      const matchLabels = [`red`, `blue`, `yellow`, `green`, `orange`, `purple`];

      return `
        <section class="hero-panel">
          ${chapterHeaderHtml(`garden`, `Chapter 1: The Colour Garden`, `Tap objects to hear their names, find hidden colours, and match labels!`)}

          <div class="pill-tabs">
            <button type="button" class="btn btn-nav ${session.gardenMode === 'explore' ? 'active' : ''}" onclick="setGardenMode('explore')">1. Explore & Listen</button>
            <button type="button" class="btn btn-nav ${session.gardenMode === 'quest' ? 'active' : ''}" onclick="setGardenMode('quest')">2. Colour Quest (${session.gardenStep}/${GARDEN_QUESTS.length})</button>
            <button type="button" class="btn btn-nav ${session.gardenMode === 'match' ? 'active' : ''}" onclick="setGardenMode('match')">3. Label Match (${session.gardenMatchedLabels.length}/6)</button>
          </div>

          ${session.gardenMode === `quest` ? `
            <div class="feedback-box" style="margin-bottom:var(--space-md); background:var(--primary-container);">
              <span>
                ${session.gardenStep < GARDEN_QUESTS.length
                  ? `Instruction: Find something <strong>${currentQuest.toUpperCase()}</strong> in the garden!`
                  : `Amazing! You found every colour in the garden!`}
              </span>
              ${session.gardenStep < GARDEN_QUESTS.length ? `<button type="button" class="btn btn-audio" onclick="speakText('Find something ${currentQuest}!')">Hear Instruction</button>` : ``}
            </div>` : ``}

          ${session.gardenMode === `match` ? `
            <div style="margin-bottom:var(--space-md);">
              <p style="margin:0 0 var(--space-xs); font-weight:700;">Tap a colour label, then tap the matching object in the garden:</p>
              <div class="swatch-row">
                ${matchLabels.map(c => {
                  const matched = session.gardenMatchedLabels.includes(c);
                  return `<button type="button" class="draggable-chip ${session.gardenSelectedLabel === c ? 'selected-drag' : ''}" ${matched ? 'disabled' : ''} onclick="pickGardenLabel('${c}')">
                    <span class="colour-dot" style="background:${COLOURS[c].css};"></span> ${COLOURS[c].name} ${matched ? '✓' : ''}
                  </button>`;
                }).join(``)}
              </div>
            </div>` : ``}

          <!-- Illustrated Garden SVG -->
          <div class="scene-frame" style="margin-bottom:var(--space-md);">
            <svg viewBox="0 0 700 340" class="scene-svg" role="img" aria-label="Interactive Colour Garden with ten colourful objects">
              <rect x="0" y="0" width="700" height="230" fill="var(--color-sky-soft)"/>
              <path d="M0 220 Q180 190 380 220 T700 210 L700 340 L0 340 Z" fill="var(--color-grass-soft)"/>

              <!-- White Cloud -->
              <g id="g-obj-cloud" class="interactive-obj" onclick="gardenClickObj('cloud')">
                <path d="M120 75 Q120 50 148 52 Q165 36 188 52 Q212 52 212 75 Q212 92 190 92 L138 92 Q120 92 120 75 Z" fill="var(--color-white)" stroke="var(--outline-variant)" stroke-width="2.5"/>
              </g>

              <!-- Yellow Sun -->
              <g id="g-obj-sun" class="interactive-obj" onclick="gardenClickObj('sun')">
                <circle cx="600" cy="65" r="34" fill="var(--color-yellow)" stroke="var(--color-orange)" stroke-width="3"/>
              </g>

              <!-- Brown Tree Trunk + Green Leaves -->
              <g id="g-obj-trunk" class="interactive-obj" onclick="gardenClickObj('trunk')">
                <rect x="520" y="150" width="32" height="120" rx="6" fill="var(--color-brown)"/>
              </g>
              <g id="g-obj-leaf" class="interactive-obj" onclick="gardenClickObj('leaf')">
                <circle cx="536" cy="135" r="48" fill="var(--color-green)"/>
                <circle cx="502" cy="150" r="32" fill="var(--color-green)"/>
                <circle cx="570" cy="150" r="32" fill="var(--color-green)"/>
              </g>

              <!-- Black Bird -->
              <g id="g-obj-crow" class="interactive-obj" onclick="gardenClickObj('crow')">
                <ellipse cx="445" cy="112" rx="18" ry="12" fill="var(--color-black)"/>
                <circle cx="458" cy="103" r="9" fill="var(--color-black)"/>
                <polygon points="466,102 476,106 466,109" fill="var(--color-orange)"/>
                <circle cx="460" cy="101" r="2" fill="var(--color-white)"/>
              </g>

              <!-- Blue Butterfly -->
              <g id="g-obj-butterfly" class="interactive-obj anim-flutter" onclick="gardenClickObj('butterfly')">
                <ellipse cx="290" cy="125" rx="18" ry="13" fill="var(--color-blue)"/>
                <ellipse cx="322" cy="125" rx="18" ry="13" fill="var(--color-blue)"/>
                <rect x="303" y="114" width="6" height="24" rx="3" fill="var(--on-surface)"/>
              </g>

              <!-- Red Flower -->
              <g id="g-obj-flower" class="interactive-obj" onclick="gardenClickObj('flower')">
                <line x1="115" y1="300" x2="115" y2="230" stroke="var(--color-green)" stroke-width="6" stroke-linecap="round"/>
                <circle cx="100" cy="222" r="14" fill="var(--color-red)"/>
                <circle cx="130" cy="222" r="14" fill="var(--color-red)"/>

                <circle cx="115" cy="222" r="10" fill="var(--color-yellow)"/>
              </g>

              <!-- Purple Flower -->
              <g id="g-obj-tulip" class="interactive-obj" onclick="gardenClickObj('tulip')">

    // -------------------------------------------------------------------------
    // CHAPTER 2: THE RAINBOW FOREST
    // -------------------------------------------------------------------------
    function forestClick(id, colour, label) {
      const msg = `I can see a ${colour} ${label}!`;
      playChime(`pop`);
      speakText(msg);

      if (colour === `green` && !session.forestFoundGreen.includes(id)) {
        session.forestFoundGreen.push(id);
        if (session.forestFoundGreen.length === 3) {
          playChime(`win`);
          speakText(`Fantastic! You found three green things in the forest!`);
        }
      }
      if (session.forestFoundGreen.length >= 3 && session.forestSentence1 === `yellow` && session.forestSentence2 === `blue`) {
        completeChapter(`forest`);
      }
      renderView();
      const fb = document.getElementById(`forest-feedback`);
      if (fb) {
        fb.className = `feedback-box success`;
        fb.textContent = `${msg} (${session.forestFoundGreen.length}/3 green things found)`;
      }
    }

    function forestCheckSentences() {
      const s1 = document.getElementById(`forest-q1`);
      const s2 = document.getElementById(`forest-q2`);
      if (!s1 || !s2) return;
      session.forestSentence1 = s1.value;
      session.forestSentence2 = s2.value;
      const fb = document.getElementById(`forest-feedback`);
      if (s1.value === `yellow` && s2.value === `blue`) {
        playChime(`win`);
        speakText(`The bird is yellow. I can see a blue butterfly!`);
        if (session.forestFoundGreen.length >= 3) completeChapter(`forest`);
        if (fb) { fb.className = `feedback-box success`; fb.textContent = `Wonderful sentences! "The bird is yellow. I can see a blue butterfly."`; }
      } else {
        playChime(`hint`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Look closely at the forest picture! What colour is the bird? What colour is the butterfly?`; }
      }
    }

    function renderForestChapter() {
      const gCount = session.forestFoundGreen.length;
      return `
        <section class="hero-panel">

    // -------------------------------------------------------------------------
    // CHAPTER 3: THE MAGIC PAINT LABORATORY
    // -------------------------------------------------------------------------
    function labPutPaint(colour) {
      playChime(`pop`);
      speakText(COLOURS[colour].name);
      if (!session.labSlotA) session.labSlotA = colour;
      else if (!session.labSlotB) session.labSlotB = colour;
      else { session.labSlotA = colour; session.labSlotB = null; }
      session.labMixResult = null;
      renderView();
    }

    function labDropPaint(ev, slotName) {
      ev.preventDefault();
      const colour = ev.dataTransfer ? ev.dataTransfer.getData(`text/plain`) : null;
      if (!colour || !COLOURS[colour]) return;
      if (slotName === `A`) session.labSlotA = colour;
      else session.labSlotB = colour;
      session.labMixResult = null;
      playChime(`pop`);
      renderView();
    }

    function labAllowDrop(ev) {
      ev.preventDefault();
    }

    function labDragStart(ev, colour) {
      if (ev.dataTransfer) ev.dataTransfer.setData(`text/plain`, colour);
    }

    function labMixColours() {
      const a = session.labSlotA;
      const b = session.labSlotB;
      if (!a || !b) {
        playChime(`hint`);
        const fb = document.getElementById(`lab-feedback`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Choose two paint bottles first!`; }
        return;
      }
      const pair = [a, b].sort().join(`+`);
      let result = a;
      let explanation = `Two ${a} paints make bright ${a}!`;

      if (pair === `red+yellow`) {
        result = `orange`;
        explanation = `Red and yellow make orange!`;
      } else if (pair === `blue+yellow`) {
        result = `green`;
        explanation = `Blue and yellow make green!`;
      } else if (pair === `blue+red`) {
        result = `purple`;
        explanation = `Red and blue make purple!`;
      } else if (pair === `red+white`) {
        result = `pink`;
        explanation = `Red and white make soft pink!`;
      }

      session.labMixResult = result;
      if ([`orange`, `green`, `purple`].includes(result) && !session.labDiscovered.includes(result)) {
        session.labDiscovered.push(result);
      }

      playChime(`win`);
      speakText(`Wow! ${explanation}`);

      if (session.labDiscovered.length >= 3) {
        completeChapter(`lab`);
      }
      renderView();
      const fb = document.getElementById(`lab-feedback`);
      if (fb) {
        fb.className = `feedback-box success`;
        fb.textContent = `Wow! ${explanation}`;
      }
    }

    function labClear() {
      session.labSlotA = null;
      session.labSlotB = null;
      session.labMixResult = null;
      renderView();
    }

    function renderLabChapter() {
      const bottles = [`red`, `yellow`, `blue`, `white`];
      const nextChallenge = !session.labDiscovered.includes(`orange`) ? `Challenge 1: Mix Red and Yellow to make Orange!`
                          : !session.labDiscovered.includes(`green`) ? `Challenge 2: What happens when you mix Blue and Yellow?`
                          : !session.labDiscovered.includes(`purple`) ? `Challenge 3: Can you make Purple?`
                          : `Free Experimentation! You discovered Orange, Green, and Purple!`;

      const bowlFill = session.labMixResult ? COLOURS[session.labMixResult].css : `var(--surface-container-high)`;

      return `
        <section class="hero-panel">
          ${chapterHeaderHtml(`lab`, `Chapter 3: The Magic Paint Laboratory`, `Experiment by mixing primary colours (Red, Yellow, Blue) inside the cauldron!`)}

          <div class="feedback-box ${session.labDiscovered.length >= 3 ? 'success' : ''}" style="margin-bottom:var(--space-md);">
            <span><strong>${nextChallenge}</strong> (${session.labDiscovered.length}/3 Secondary Colours Discovered)</span>
            <button type="button" class="btn btn-audio" onclick="speakText(\`${nextChallenge}\`)">Hear Challenge</button>
          </div>

          <div class="grid-2" style="align-items:center;">
            <!-- Paint Bottles Shelf -->
            <div class="card card-grape">
              <h3>1. Drag or Tap Two Paint Bottles</h3>
              <p style="margin-top:0; color:var(--on-surface-variant); font-size:0.9rem;">Primary colours are Red, Yellow, and Blue. Try White too!</p>
              <div class="swatch-row" style="margin-top:var(--space-md);">
                ${bottles.map(c => `
                  <button type="button" class="draggable-chip" draggable="true" ondragstart="labDragStart(event, '${c}')" onclick="labPutPaint('${c}')" style="padding: 0.6rem 1.1rem;">
                    <span class="colour-dot" style="background:${COLOURS[c].css};"></span>
                    <span>${COLOURS[c].name}</span>
                  </button>`).join(``)}
              </div>

              <div style="margin-top:var(--space-lg);">
                <span class="kicker">Discovered Secondary Colours</span>
                <div class="swatch-row">
                  ${[`orange`, `green`, `purple`].map(sec => {
                    const found = session.labDiscovered.includes(sec);
                    return `<span class="badge ${found ? 'badge-positive' : ''}">
                      <span class="colour-dot" style="width:14px; height:14px; background:${found ? COLOURS[sec].css : 'var(--color-grey-light)'};"></span>
                      ${found ? COLOURS[sec].name : '???'}
                    </span>`;
                  }).join(``)}
                </div>
              </div>
            </div>

            <!-- Mixing Bowl & Result -->
            <div class="card card-sky mixing-bowl-wrap">
              <h3>2. Magical Mixing Cauldron</h3>
              <div class="paint-slot-row">
                <div class="paint-slot" ondragover="labAllowDrop(event)" ondrop="labDropPaint(event, 'A')" onclick="labClear()" style="background:${session.labSlotA ? COLOURS[session.labSlotA].css : 'var(--surface-container)'}; color:${session.labSlotA && COLOURS[session.labSlotA].textLight ? 'var(--color-white)' : 'var(--on-surface)'};">
                  ${session.labSlotA ? COLOURS[session.labSlotA].name : 'Drop Paint 1'}
                </div>
                <span style="font-size:1.5rem; font-weight:900;">+</span>
                <div class="paint-slot" ondragover="labAllowDrop(event)" ondrop="labDropPaint(event, 'B')" onclick="labClear()" style="background:${session.labSlotB ? COLOURS[session.labSlotB].css : 'var(--surface-container)'}; color:${session.labSlotB && COLOURS[session.labSlotB].textLight ? 'var(--color-white)' : 'var(--on-surface)'};">
                  ${session.labSlotB ? COLOURS[session.labSlotB].name : 'Drop Paint 2'}
                </div>
              </div>

              <!-- SVG Cauldron -->
              <svg viewBox="0 0 220 130" width="200" height="120" aria-hidden="true">
                <ellipse cx="110" cy="48" rx="68" ry="20" fill="${bowlFill}" stroke="var(--on-surface)" stroke-width="3"/>
                <path d="M42 48 C42 115, 178 115, 178 48 Z" fill="var(--on-surface-variant)"/>
                <ellipse cx="110" cy="48" rx="62" ry="15" fill="${bowlFill}"/>
                ${session.labMixResult ? `<text x="110" y="90" text-anchor="middle" font-size="16" font-weight="900" fill="var(--color-white)">${COLOURS[session.labMixResult].name.toUpperCase()}!</text>` : ``}
              </svg>

              <div style="display:flex; gap:var(--space-sm); flex-wrap:wrap; justify-content:center;">
                <button type="button" class="btn btn-primary" onclick="labMixColours()">
                  <i data-lucide="sparkles" aria-hidden="true"></i> MIX COLOURS
                </button>
                <button type="button" class="btn btn-soft" onclick="labClear()">Clear Bowl</button>
              </div>
            </div>
          </div>

          <div id="lab-feedback" class="feedback-box" style="margin-top:var(--space-md);">
            <span>Select two colours and press MIX COLOURS!</span>
          </div>
        </section>
      `;
    }

    // -------------------------------------------------------------------------
    // CHAPTER 4: THE COLOURFUL FRUIT MARKET
    // -------------------------------------------------------------------------
    const MARKET_FRUITS = [
      { id: `apple`,      name: `Red Apple`,       colour: `red`,    plural: `red apples` },
      { id: `banana`,     name: `Yellow Banana`,   colour: `yellow`, plural: `yellow bananas` },
      { id: `watermelon`, name: `Green Watermelon`,colour: `green`,  plural: `green watermelons` },
      { id: `orange`,     name: `Orange Orange`,   colour: `orange`, plural: `orange oranges` },
      { id: `grape`,      name: `Purple Grapes`,   colour: `purple`, plural: `purple grapes` },
      { id: `dragon`,     name: `Pink Dragon Fruit`,colour:`pink`,   plural: `pink dragon fruits` },
      { id: `coconut`,    name: `Brown Coconut`,   colour: `brown`,  plural: `brown coconuts` }
    ];

    function marketAddFruit(fruitId) {
      const f = MARKET_FRUITS.find(x => x.id === fruitId);
      if (!f) return;
      session.marketBasket.push(fruitId);
      playChime(`pop`);
      speakText(f.name);
      checkMarketOrder();
      renderView();
    }

    function marketClearBasket() {
      session.marketBasket = [];
      renderView();
    }

    function checkMarketOrder() {
      const apples = session.marketBasket.filter(x => x === `apple`).length;
      const bananas = session.marketBasket.filter(x => x === `banana`).length;
      const grapes = session.marketBasket.filter(x => x === `grape`).length;

      if (session.marketOrderIndex === 0 && apples === 3 && bananas === 2 && session.marketBasket.length === 5) {
        playChime(`win`);
        speakText(`Great job! Three red apples and two yellow bananas!`);
        session.marketOrderIndex = 1;
        session.marketBasket = [];
      } else if (session.marketOrderIndex === 1 && grapes === 2 && session.marketBasket.filter(x => x === `watermelon`).length === 1 && session.marketBasket.length === 3) {
        playChime(`win`);
        speakText(`Wonderful shopping! You finished the fruit market!`);
        completeChapter(`market`);
      }
    }

    function marketDialoguePick(choice) {
      const fb = document.getElementById(`market-dialogue-fb`);
      if (choice === `correct`) {
        session.marketDialogueStep = 1;
        playChime(`win`);
        speakText(`I would like two red apples, please. Here you are! Thank you!`);
        if (session.marketOrderIndex >= 1) completeChapter(`market`);
        renderView();
      } else {
        playChime(`hint`);
        speakText(`Remember to say please when asking the shopkeeper!`);
        if (fb) { fb.className = `feedback-box hint`; fb.textContent = `Try the polite sentence with "please"!`; }
      }
    }

    function renderFruitIcon(id, size) {
      const s = size || 42;
      if (id === `apple`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="15" fill="var(--color-red)"/><path d="M24 12 Q28 4 34 8 Q28 14 24 12 Z" fill="var(--color-green)"/></svg>`;
      if (id === `banana`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 30 Q22 40 38 14 Q34 28 16 34 Z" fill="var(--color-yellow)" stroke="var(--color-orange)" stroke-width="2"/></svg>`;
      if (id === `watermelon`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16" fill="var(--color-green)"/><path d="M14 14 Q24 24 14 34 M24 10 Q32 24 24 38" stroke="var(--on-surface)" stroke-width="2" fill="none"/></svg>`;
      if (id === `orange`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="15" fill="var(--color-orange)"/><circle cx="24" cy="11" r="3" fill="var(--color-green)"/></svg>`;
      if (id === `grape`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="19" cy="20" r="6" fill="var(--color-purple)"/><circle cx="29" cy="20" r="6" fill="var(--color-purple)"/><circle cx="24" cy="29" r="6" fill="var(--color-purple)"/><circle cx="24" cy="37" r="5" fill="var(--color-purple)"/></svg>`;
      if (id === `dragon`) return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="26" rx="13" ry="16" fill="var(--color-pink)"/><path d="M16 14 L24 6 L32 14" stroke="var(--color-green)" stroke-width="3" fill="none"/></svg>`;
      return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="25" r="15" fill="var(--color-brown)"/><circle cx="20" cy="20" r="2" fill="var(--on-surface)"/><circle cx="26" cy="20" r="2" fill="var(--on-surface)"/></svg>`;
    }

    function renderMarketChapter() {
      const orderText = session.marketOrderIndex === 0
        ? `Challenge 1: Put <strong>3 red apples</strong> and <strong>2 yellow bananas</strong> into your basket!`
        : `Challenge 2: Put <strong>2 purple grapes</strong> and <strong>1 green watermelon</strong> into your basket!`;

      return `
        <section class="hero-panel">
          ${chapterHeaderHtml(`market`, `Chapter 4: The Colourful Fruit Market`, `Tap fruits to hear their colour names and fill your shopping basket!`)}

          <div class="feedback-box ${appState.completedChapters.includes('market') ? 'success' : ''}" style="margin-bottom:var(--space-md);">
            <span>${orderText}</span>
            <button type="button" class="btn btn-audio" onclick="speakText('${session.marketOrderIndex === 0 ? 'Put three red apples and two yellow bananas into your basket!' : 'Put two purple grapes and one green watermelon into your basket!'}')">Hear Order</button>
          </div>

          <div class="grid-2">

                    ${renderFruitIcon(f.id, 40)}

                  </button>`).join(``)}
              </div>
            </div>

            <!-- Live Visual Shopping Basket -->
            <div class="card card-sky" style="display:flex; flex-direction:column; justify-content:space-between; gap:var(--space-md);">
              <div>
                <h3>Your Shopping Basket (${session.marketBasket.length} items)</h3>
                <div class="drop-zone" style="min-height:140px; flex-direction:row; flex-wrap:wrap; margin-top:var(--space-sm);">
                  ${session.marketBasket.length === 0
                    ? `<span style="color:var(--on-surface-variant);">Your basket is empty! Tap fruits to put them here.</span>`
                    : session.marketBasket.map(id => renderFruitIcon(id, 38)).join(``)}
